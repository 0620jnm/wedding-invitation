<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jay & Michelle Wedding</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Noto+Serif+TC:wght@300;400&display=swap" rel="stylesheet">
<style>
/* 核心樣式 */
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Serif TC',serif;background:#faf8f5;color:#2c2c2c; overflow: hidden;} 

/* 溫柔浪漫的照片掉落開場 */
#intro-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
    background: #e8dcc4; z-index: 10000;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 1.8s ease;
}
.photo-stack { position: relative; width: 280px; height: 380px; cursor: pointer; }
.photo {
    position: absolute; width: 100%; height: 100%;
    background: #fff; border: 12px solid #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    display: flex; align-items: center; justify-content: center;
    transition: transform 2.8s cubic-bezier(0.25, 0.1, 0.25, 1), opacity 1.2s ease-out; 
    background-size: cover; 
    background-position: center;
    background-repeat: no-repeat;
}
.photo::after { content: "TAP"; font-family: 'Cormorant Garamond'; color: #c9a96e; font-size: 1.1rem; letter-spacing: 0.2em; opacity: 0.6; }

/* 初始旋轉角度 */
.photo:nth-child(1) { transform: rotate(-4deg); z-index: 3; }
.photo:nth-child(2) { transform: rotate(2deg); z-index: 2; }
.photo:nth-child(3) { transform: rotate(-1deg); z-index: 1; }

/* 照片飄落動畫 */
.photo.dropped { 
    transform: translateY(130vh) translateX(40px) rotate(35deg) !important; 
    opacity: 0; 
}

/* 主畫面 */
#main-wrapper { opacity: 0; transition: opacity 2s ease; }
.cover{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#f5f5dc,#e8dcc4);text-align:center}
.cover h1{font-family:'Cormorant Garamond',serif;font-size:clamp(3rem,10vw,5.5rem);font-weight:300}
.cover .amp{color:#c9a96e;font-style:italic}
.cover p{margin-top:20px;letter-spacing:0.3em;color:#888}
section{padding:80px 24px;max-width:700px;margin:0 auto;text-align:center}
h2{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:300;color:#c9a96e;margin-bottom:20px}
.info{background:#fff;padding:30px;margin:20px 0;border:1px solid #e0d9d0}
iframe{width:100%;height:350px;border:1px solid #e0d9d0;margin:20px 0}
button{width:100%;padding:15px;background:#2c2c2c;color:#fff;border:none;cursor:pointer;margin-top:10px;letter-spacing:0.2em}
button:hover{background:#c9a96e}
</style>
</head>
<body>

<div id="intro-overlay">
    <div class="photo-stack">
        <div class="photo" onclick="dropPhoto(this)" style="background-image: url('https://drive.google.com/uc?export=view&id=1bodtrUku_sCWA136H5rhLcKbq5oR21vT');"></div>
        <div class="photo" onclick="dropPhoto(this)" style="background-image: url('https://drive.google.com/uc?export=view&id=1bJ2RnW-OiO-ny2AujRRcoRuOGM9HUvdz');"></div>
        <div class="photo" onclick="dropPhoto(this)" style="background-image: url('https://drive.google.com/uc?export=view&id=1hcgzizO944EDRYrdURyjHygC-J9bQCd9');"></div>
    </div>
</div>

<div id="main-wrapper">
    <div class="cover">
        <p style="font-size:0.85rem;letter-spacing:0.35em;color:#c9a96e;margin-bottom:18px">WE'RE GETTING MARRIED</p>
        <h1>Jay <span class="amp">&</span> Michelle</h1>
        <p>2026·06·20</p>
    </div>

    <section>
        <h2>誠摯邀請您</h2>
        <p style="line-height:2">我們誠摯邀請您，一同見證我們的幸福時刻，分享這份喜悅與愛。<br><br>
        愛情是一段奇妙的旅程，而今天，我們即將啟航人生新的篇章。<br>
        謝謝你一直以來的支持與陪伴。
        </p>
    </section>

    <section>
        <h2>Wedding Info</h2>
        <div class="info">
            <h3 style="color:#c9a96e;letter-spacing:0.2em;margin-bottom:10px">日期</h3>
            <p style="font-size:1.5rem">2026年6月20日</p>
        </div>
        <div class="info">
            <h3 style="color:#c9a96e;letter-spacing:0.2em;margin-bottom:10px">地點</h3>
            <p>暖居日穀<br>台中市北屯區松竹路一段3號</p>
        </div>
    </section>

    <section>
        <h2>婚宴地點</h2>
        <iframe 
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3639.141885542841!2d120.70788307590215!3d24.184307572352844!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x34691930ddbe73b5%3A0xe9019e28fe9eeee1!2z5pqW5bGF5pel56穀!5e0!3m2!1szh-TW!2stw!4v1710000000000!5m2!1szh-TW!2stw" 
            style="border:0;" allowfullscreen="" loading="lazy"></iframe>
        
        <a href="https://maps.app.goo.gl/uXpDshE8N6y8j9b96" target="_blank" style="display:inline-block;margin-top:15px;padding:10px 25px;border:1px solid #c9a96e;color:#c9a96e;text-decoration:none;letter-spacing:0.1em">開啟 Google 地圖導航</a>
    </section>

    <footer style="text-align:center;padding:60px 24px;font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-style:italic;color:#c9a96e">
        See You Soon
    </footer>
</div>

<div id="player" style="position:fixed;top:-9999px;left:-9999px;"></div>
<button id="musicToggle" style="position:fixed;bottom:20px;right:20px;width:45px;height:45px;border-radius:50%;background:#c9a96e;border:none;color:white;font-size:20px;cursor:pointer;z-index:9999;">▶</button>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
let droppedCount = 0;
function dropPhoto(el) {
    if (el.classList.contains('dropped')) return;
    el.classList.add('dropped');
    droppedCount++;
    if (droppedCount === 3) {
        setTimeout(() => {
            document.getElementById('intro-overlay').style.opacity = '0';
            document.getElementById('main-wrapper').style.opacity = '1';
            document.body.style.overflow = 'auto'; 
            if (player && player.playVideo) player.playVideo();
            setTimeout(() => { document.getElementById('intro-overlay').style.display = 'none'; }, 2000);
        }, 1200);
    }
}

var player;
function onYouTubeIframeAPIReady() {
  player = new YT.Player('player', {
    videoId: 'pmrCXt4lNyA',
    playerVars: { 'autoplay': 1, 'loop': 1, 'playlist': 'pmrCXt4lNyA', 'controls': 0 },
    events: {
      'onReady': (e) => { e.target.setVolume(30); },
      'onStateChange': (e) => {
          document.getElementById('musicToggle').innerHTML = (e.data == 1) ? '⏸' : '▶';
      }
    }
  });
}
document.getElementById('musicToggle').addEventListener('click', function() {
  if (player && player.getPlayerState) {
    player.getPlayerState() == 1 ? player.pauseVideo() : player.playVideo();
  }
});
</script>
</body>
</html>
