<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jay & Michelle Wedding Invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Noto+Serif+TC:wght@300;400&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Noto Serif TC', serif; background: #faf8f5; color: #2c2c2c; line-height: 1.8; overflow: hidden; }

    /* --- 信封開場：深色質感背景 --- */
    #envelope-wrapper {
        position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
        background: radial-gradient(circle, #4a3f35 0%, #1a1614 100%);
        display: flex; align-items: center; justify-content: center;
        z-index: 10000; transition: opacity 1s ease 1.5s; perspective: 1000px;
    }

    .envelope-box {
        position: relative; width: 320px; height: 210px; cursor: pointer;
        transition: transform 0.3s ease;
    }
    .envelope-box:hover { transform: scale(1.03) translateY(-5px); }

    /* 信封本體 */
    .env-paper {
        position: absolute; width: 100%; height: 100%;
        background: #e6d8c3; border-radius: 4px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        overflow: hidden;
    }

    /* 信封翻蓋 (V型) */
    .env-flap {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: #d4c3ab;
        clip-path: polygon(0 0, 100% 0, 50% 60%);
        z-index: 5; transform-origin: top;
        transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        border-bottom: 1px solid rgba(0,0,0,0.1);
    }

    /* --- 立體蜂蠟與乾燥花束 (純CSS繪製) --- */
    .seal-area {
        position: absolute; top: 110px; left: 50%; transform: translateX(-50%);
        z-index: 10; transition: all 0.6s ease;
    }

    /* 乾燥花束模擬 */
    .flower-stem {
        position: absolute; bottom: 10px; left: 50%; width: 2px; height: 60px;
        background: #5d6d4e; transform: translateX(-50%) rotate(-15deg);
    }
    .flower-leaf {
        position: absolute; bottom: 30px; left: 55%; width: 15px; height: 8px;
        background: #7a8a68; border-radius: 50%; transform: rotate(20deg);
    }

    /* 蜂蠟封印 */
    .wax-seal {
        position: relative; width: 55px; height: 55px;
        background: radial-gradient(circle, #a32a2a 0%, #7a1a1a 100%);
        border-radius: 50%;
        box-shadow: inset 0 0 10px rgba(0,0,0,0.3), 0 4px 10px rgba(0,0,0,0.5);
        display: flex; align-items: center; justify-content: center;
        border: 2px solid #8b2020;
    }
    .wax-seal::after {
        content: "JM"; color: rgba(255,255,255,0.2); font-size: 14px;
        font-family: serif; font-weight: bold; border: 1px solid rgba(255,255,255,0.1);
        padding: 4px; border-radius: 50%;
    }

    /* 打開狀態 */
    .envelope-box.open .env-flap { transform: rotateX(160deg); z-index: 1; }
    .envelope-box.open .seal-area { opacity: 0; transform: translateX(-50%) translateY(30px); }

    /* --- 內容滑出 --- */
    #main-content { opacity: 0; transform: translateY(100vh); transition: all 1.5s ease; }
    #main-content.reveal { opacity: 1; transform: translateY(0); }

    /* 原有內容樣式優化 */
    .cover { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #faf8f5; text-align: center; }
    .cover h1 { font-family: 'Cormorant Garamond', serif; font-size: 4rem; margin: 10px 0; }
    section { padding: 60px 24px; max-width: 600px; margin: 0 auto; text-align: center; }
    .info { background: #fff; padding: 30px; margin: 20px 0; border-radius: 20px; border: 1px solid #eee; }
    .btn-nav { display: inline-block; padding: 12px 35px; background: #8d705a; color: #fff; text-decoration: none; border-radius: 30px; margin-top: 20px; }
    .music-btn { position: fixed; bottom: 20px; right: 20px; width: 50px; height: 50px; border-radius: 50%; background: #c9a96e; border: none; color: white; cursor: pointer; z-index: 999; }
</style>
</head>
<body>

<div id="envelope-wrapper">
    <div class="envelope-box" id="envBox" onclick="openEnvelope()">
        <div class="env-paper">
            <div class="env-flap"></div>
        </div>
        <div class="seal-area">
            <div class="flower-stem"></div>
            <div class="flower-leaf" style="left:40%; bottom:40%; transform:rotate(-40deg);"></div>
            <div class="flower-leaf"></div>
            <div class="wax-seal"></div>
        </div>
    </div>
    <p style="position:absolute; bottom:20%; color:#c9a96e; letter-spacing:3px; font-size:12px;">TAP TO OPEN</p>
</div>

<div id="main-content">
    <div class="cover">
        <p style="color:#c9a96e; letter-spacing:5px;">WE ARE GETTING MARRIED</p>
        <h1>Jay <span style="font-style:italic;color:#c9a96e;">&</span> Michelle</h1>
        <p>2026 / 06 / 20</p>
    </div>

    <section>
        <h2 style="color:#c9a96e; font-family:serif; margin-bottom:20px;">誠摯邀請</h2>
        <p>我們即將開啟人生新的篇章，<br>誠摯邀請您與我們一同分享這份喜悅。</p>
        
        <div class="info">
            <p style="font-size:0.8rem; color:#888;">DATE</p>
            <p style="font-size:1.4rem;">2026.06.20 (Sat)</p>
        </div>
        <div class="info">
            <p style="font-size:0.8rem; color:#888;">VENUE</p>
            <p>暖居日穀<br>台中市北屯區松竹路一段3號</p>
        </div>
        
        <div style="margin:40px 0;">
            <div style="border-radius:20px; overflow:hidden; border:1px solid #eee;">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3639.670690014022!2d120.72744887612185!3d24.18328637837683!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x34691930ddbe73b5%3A0x29019e28fe9eeef1!2z5pqW5bGF5pel56穀!5e0!3m2!1szh-TW!2stw!4v1710000000000" width="100%" height="300" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
            </div>
            <a href="https://maps.app.goo.gl/ChIJtXO-3TAZaTQR8e6e_iieAek" target="_blank" class="btn-nav">開啟 Google 地圖導航</a>
        </div>
    </section>

    <footer style="padding:100px 0; color:#c9a96e; font-style:italic; font-size:1.5rem;">
        See You Soon
    </footer>
</div>

<div id="player" style="position:fixed;top:-999px;left:-999px;"></div>
<button id="musicToggle" class="music-btn">▶</button>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
    function openEnvelope() {
        document.getElementById('envBox').classList.add('open');
        setTimeout(() => {
            document.getElementById('main-content').classList.add('reveal');
            document.body.style.overflow = 'auto';
            if (player) player.playVideo();
        }, 800);
        setTimeout(() => {
            document.getElementById('envelope-wrapper').style.opacity = '0';
        }, 1500);
        setTimeout(() => {
            document.getElementById('envelope-wrapper').style.display = 'none';
        }, 2500);
    }

    var player;
    function onYouTubeIframeAPIReady() {
        player = new YT.Player('player', {
            videoId: 'pmrCXt4lNyA',
            playerVars: { 'autoplay': 0, 'loop': 1, 'playlist': 'pmrCXt4lNyA' },
            events: { 'onStateChange': (e) => {
                document.getElementById('musicToggle').innerHTML = (e.data == 1) ? '⏸' : '▶';
            }}
        });
    }
    document.getElementById('musicToggle').onclick = () => {
        player.getPlayerState() == 1 ? player.pauseVideo() : player.playVideo();
    };
</script>
</body>
</html>
