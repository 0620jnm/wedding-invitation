<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Jay & Michelle</title>

<!-- 強制優先載入字體與圖片 -->
<link rel="preload" href="my%20font.ttf" as="font" type="font/ttf" crossorigin="anonymous">
<link rel="preload" href="polaroid.png" as="image">
<link rel="preload" href="P3.jpg" as="image">
<link rel="preload" href="P2.png" as="image">

<!-- 優先連接 Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 包含 Nanum Pen Script 字體 -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Gwendolyn:wght@400;700&family=Nanum+Pen+Script&family=Noto+Serif+TC:wght@200;300;400;500;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

<style>
@font-face {
    font-family: 'my font';
    src: url('my%20font.ttf') format('truetype'); 
    font-display: swap; 
}

/* 載入辰宇落雁體 (沉魚落雁體) */
@font-face {
    font-family: 'ChenYuluoyan';
    src: url('https://cdn.jsdelivr.net/gh/Chenyu-otf/chenyuluoyan_thin@main/ChenYuluoyan-Thin.ttf') format('truetype');
    font-display: swap;
}

*{margin:0;padding:0;box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
html, body { width: 100%; min-height: 100%; background: #faf8f5; overflow: hidden; }
body { font-family: 'my font', 'Noto Serif TC', serif; color: #2c2c2c; overflow-x: hidden; }

/* --- 開場：Polaroid 列印動畫 --- */
#intro-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #e8dcc4;
    z-index: 10000;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 1.5s ease-in-out;
    touch-action: none;
    cursor: pointer;
}

/* 閃光燈特效 */
#flash-effect {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: #fff;
    z-index: 20000;
    opacity: 0;
    pointer-events: none; 
}
#flash-effect.is-flashing {
    animation: flashBang 0.8s ease-out forwards;
}
@keyframes flashBang {
    0%   { opacity: 0; }
    10%  { opacity: 1; }
    100% { opacity: 0; }
}

/* ★ 整個場景容器（負責鏡頭平移） ★ */
#scene-container {
    position: relative;
    transform: translateY(0);
    /* 鏡位平移的動畫時間與曲線 */
    transition: transform 3.5s cubic-bezier(0.25, 0.8, 0.25, 1);
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
}

/* 鏡頭往下轉移的幅度維持在 -60vh，讓下方的照片群置中 */
#scene-container.is-panning {
    transform: translateY(-70vh); 
}

/* 相機與第一張照片（P3）的主體 wrapper */
.polaroid-wrapper {
    position: relative;
    width: min(340px, 80vw);
    transition: transform 3.5s cubic-bezier(0.25, 0.8, 0.25, 1);
    z-index: 10;
}

.camera-img {
    display: block;
    width: 100%;
    height: auto;
    position: relative;
    z-index: 10;
    pointer-events: none;
    transition: opacity 3.5s ease;
}

/* 兩張照片共通的「拍立得白色邊框」設定 */
.photo-frame {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 5;
    background: #fdfdfd;
    box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    /* 拍立得邊框比例：上方與左右留窄邊，下方留大面積空白 (22%) */
    padding: 6% 6% 22% 6%; 
}

/* P3 第一張照片（動態印出）的容器 */
.print-photo-container {
    position: absolute;
    width: 47%;
    left: 26.5%;
    top: 68.3%; 
    z-index: 20;
    clip-path: inset(0 -50px -200% -50px);
    transform-origin: top center;
    transition: transform 3.5s cubic-bezier(0.25, 0.8, 0.25, 1);
    will-change: transform;
}

.print-photo {
    transform: translateY(-95%);
    opacity: 0; 
}

.print-photo-inner {
    width: 100%;
    height: 100%;
    background-image: url('P3.jpg'); 
    background-size: cover;
    background-position: center;
    filter: brightness(0.1) saturate(0.1);
    box-shadow: inset 0 0 5px rgba(0,0,0,0.1);
}

/* ★ P2 第二張照片（一開始藏在下方，不透明）的容器 ★ */
.static-photo-container {
    position: absolute;
    width: 45%;
    /* 位置固定在相機的右側 */
    left: 52%;
    /* 藏在很下方的地方 */
    top: 220%; 
    z-index: 5; 
    transform: rotate(8deg);
    /* 一開始就是 100% 可見，純粹靠鏡頭往下平移才會出現 */
    opacity: 1; 
}

.static-photo-inner {
    width: 100%;
    height: 100%;
    background-image: url('P2.png');
    background-size: cover;
    background-position: center;
    box-shadow: inset 0 0 5px rgba(0,0,0,0.1);
}

/* P2 照片底部的空白處手寫字 */
.photo-date {
    position: absolute;
    /* 調整對齊：利用整個底部留白高度置中 */
    /* 留白大約佔整體的 22%，所以 11% 是這塊留白的中心高度 */
    bottom: 11%;
    left: 50%;
    /* translateY(50%) 確保字體的中心點對齊那條線 */
    transform: translate(-50%, 50%);
    width: 100%;
    text-align: center;
    font-family: 'Nanum Pen Script', cursive;
    font-size: clamp(1.2rem, 4.5vw, 1.8rem); 
    color: #3b3b3b; 
    opacity: 0.85; 
    letter-spacing: 0.1em;
    pointer-events: none;
    z-index: 2;
}

/* 運鏡特效：相機上抽與淡出，P3 稍微往左下擺 */
.polaroid-wrapper.is-focusing {
    transform: translateY(-20vh);
}

.polaroid-wrapper.is-focusing .camera-img {
    opacity: 0;
}

.polaroid-wrapper.is-focusing .print-photo-container {
    /* P3 印出後往下飄落，跟 P2 差不多低 */
    transform: translate(-55%, 60vh) rotate(-6deg);
}

/* 印出動畫 */
.print-photo.is-printing {
    opacity: 1; 
    animation: photoPrint 2.5s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
}
@keyframes photoPrint {
    0%   { transform: translateY(-95%); }
    100% { transform: translateY(0%); }
}

.print-photo.is-developed .print-photo-inner {
    animation: developFade 4s forwards;
}
@keyframes developFade {
    0%   { filter: brightness(0.1) saturate(0.1); }
    100% { filter: brightness(1)   saturate(1); }
}

/* 點擊文字提示 */
.print-hint {
    position: absolute;
    bottom: -80px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'my font';
    font-size: 1.5rem;
    letter-spacing: 0.2em;
    color: #8a7448;
    white-space: nowrap;
    opacity: 0; 
    transition: opacity 0.3s ease;
    z-index: 30;
}
.print-hint.ready {
    animation: hintBlink 1.4s infinite;
}
@keyframes hintBlink {
    0%,100% { opacity: 1; }
    50%     { opacity: 0.4; }
}

/* --- 主視覺 --- */
#main-wrapper { opacity: 0; visibility: hidden; transition: opacity 2s ease; width: 100%; }
#main-wrapper.is-visible { opacity: 1; visibility: visible; }

.cover {
    height: 100vh; width: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; position: relative;
    overflow: hidden; background-color: #f5f5dc;
}
.cover::before {
    content: ""; position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    background-image: url('bg_silk.jpg.png');
    background-size: cover; background-position: center;
    z-index: 1;
}
.getting-married-text { 
    color:#c9a466; margin-bottom: 15px; letter-spacing: 0.3em;
    /* 稍微把字體放大 */
    font-size: clamp(1.2rem, 4vw, 1.6rem); z-index: 10; font-weight: 300;
    position: relative; font-family: 'my font', serif;
}
.name-container { position: relative; z-index: 10; width: 100%; }
.english-names { font-family: 'Playfair Display', serif; font-size: clamp(1.8rem, 6vw, 3.2rem); color: #2c2c2c; letter-spacing: 0.05em; }
.english-names .amp { font-family: 'Gwendolyn', cursive; font-size: clamp(3.5rem, 10vw, 5.5rem); color: #c9a466; margin: 0 8px; vertical-align: middle; }
.chinese-names { display: flex; justify-content: space-around; width: 85%; max-width: 450px; margin: 20px auto 0; font-family: 'my font'; font-size: 2.2rem; letter-spacing: 0.2em; color: #4a4a4a; }

/* 宣告結婚的文字 */
.wedding-announce {
    font-family: 'ChenYuluoyan', 'my font', cursive; /* 這裡套用辰宇落雁體 */
    font-size: 2.2rem; /* 字體大小 */
    color: #5a4a34;
    margin-top: 25px; /* 與上方姓名的距離 */
    letter-spacing: 0.15em;
}

/* --- 倒數月曆 --- */
.countdown-section { padding: 70px 20px 50px; background: #fbf9f7; text-align: center; }
.flip-countdown-wrapper { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 20px; font-family: 'my font'; color: #c9a466; font-size: 2.2rem; font-weight: 700; letter-spacing: 0.1em; }
.flip-box { display: flex; gap: 4px; }
.flip-digit { background: #fff; border: 1px solid #e0d9d0; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-radius: 8px; padding: 4px 10px; min-width: 45px; text-align: center; position: relative; transition: transform 0.1s ease-in-out; }
.flip-digit.flipping { transform: scale(1.1) translateY(-2px); color: #a88448; }
.countdown-grid { max-width: 640px; margin: 0 auto; background: #fff; border-radius: 24px; border: 1px solid #e0d9d0; box-shadow: 0 12px 28px rgba(0,0,0,0.08); padding: 28px 24px 24px; }
.countdown-header { display: flex; justify-content: center; align-items: baseline; margin-bottom: 18px; font-family: 'my font'; color: #c9a466; }
.countdown-month { letter-spacing: 0.35em; font-size: 2.2rem; font-weight: 600; }
.countdown-days-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-bottom: 10px; }
.countdown-day-label, .countdown-day-cell { width: 100%; padding: 10px 0; text-align: center; font-family: 'my font'; font-size: 1.4rem; }
.countdown-day-label { color: #b79b6b; }
.countdown-day-cell { border-radius: 12px; color: #5a4a34; }
.cd-empty { background: transparent; }
.cd-normal { background: #f5eee3; }
.cd-today { background: #c9a466; color: #fff; font-weight: 600; }
.cd-wedding { background: #f2e3cf; color: #2c2c2c; font-weight: 700; position: relative; box-shadow: 0 0 0 0 rgba(201,164,102,0.5); animation: weddingPulse 1.8s infinite; display: flex; align-items: center; justify-content: center; gap: 4px; }
.cd-wedding::after { content: "♥"; position: static; font-size: 0.9rem; color: #000; }
@keyframes weddingPulse { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(201,164,102,0.4); } 50% { transform: scale(1.06);box-shadow: 0 0 0 10px rgba(201,164,102,0); } 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(201,164,102,0); } }
.countdown-footer { margin-top: 16px; font-family: 'my font'; font-size: 0.95rem; color: #777; }

/* Info / Form / Notes */
.info-section { padding: 80px 20px; background: #fbf9f7; text-align: center; }
.info-card { max-width: 600px; background: #fff; padding: 40px 20px; margin: 30px auto; border: 1px solid #e0d9d0; }
.map-container { width: 100%; height: 350px; margin: 25px 0; border: 1px solid #e0d9d0; border-radius: 8px; overflow: hidden; }

.form-section { padding: 80px 20px; text-align: center; }
.form-card { max-width: 550px; background: #fff; padding: 40px 30px; margin: 0 auto; border: 1px solid #e0d9d0; border-radius: 12px; }
.form-group { margin-bottom: 30px; text-align: left; }
.form-group label { display: block; font-family: 'my font'; font-size: 1.1rem; margin-bottom: 10px; color: #444; }
.form-group input[type="text"], .form-group textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-family: 'my font'; font-size: 1rem; }
.radio-stack { display: flex; flex-direction: column; gap: 15px; margin-top: 10px; }
.radio-stack label { display: flex; align-items: center; font-size: 1.1rem; font-family: 'my font'; cursor: pointer; }
.radio-stack input { width: 18px; height: 18px; margin-right: 10px; }
.submit-btn { width: 100%; padding: 16px; background: #c9a466; color: #fff; border: none; font-family: 'my font'; font-size: 1.2rem; cursor: pointer; border-radius: 8px; }

.sticky-wall { display: flex; flex-wrap: wrap; justify-content: center; gap: 30px; padding: 40px 10px; max-width: 950px; margin: 0 auto; }
.sticky-note { width: 210px; min-height: 190px; padding: 35px 20px 20px; box-shadow: 3px 6px 15px rgba(0,0,0,0.1); position: relative; font-family: 'my font'; text-align: left; transition: 0.3s; transform: rotate(var(--note-rot)) translate(var(--note-x), var(--note-y)); }
.note-text { font-size: 1.1rem; line-height: 1.5; margin-bottom: 15px; color: #333; word-break: break-all; }
.note-author { font-size: 0.95rem; text-align: right; border-top: 1px dashed rgba(0,0,0,0.15); padding-top: 10px; }
.sticky-note::before { content: ""; position: absolute; top: -12px; left: 50%; transform: translateX(-50%); width: 24px; height: 24px; background-color: #a82424; border-radius: 50%; z-index: 2; }
.sticky-note:nth-child(5n+1) { background-color: #C9A466; }
.sticky-note:nth-child(5n+2) { background-color: #EBDDB5; }
.sticky-note:nth-child(5n+3) { background-color: #F7F6ED; }
.sticky-note:nth-child(5n+4) { background-color: #DDE7A9; }
.sticky-note:nth-child(5n+5) { background-color: #A6A35D; }

#musicToggle { position: fixed; bottom: 20px; right: 20px; width: 45px; height: 45px; border-radius: 50%; background: #c9a466; border: none; color: white; z-index: 9999; cursor: pointer; }
</style>
</head>

        <div class="polaroid-wrapper" id="polaroid-wrapper">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import { getDatabase, ref, push, onValue, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";
const firebaseConfig = { apiKey: "AIzaSyAUFF7GdX7fAtK_wK5-YAffirtap52UgCg", authDomain: "wedding-e6351.firebaseapp.com", databaseURL: "https://wedding-e6351-default-rtdb.firebaseio.com", projectId: "wedding-e6351", storageBucket: "wedding-e6351.firebasestorage.app", messagingSenderId: "382633819825", appId: "1:382633819825:web:b3352f4f4e67423878ec90" };
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const wishesRef = ref(db, 'wishes');

document.getElementById('wish-form').addEventListener('submit', (e) => { 
    e.preventDefault(); 
    const name = document.getElementById('wish-name').value; 
    const message = document.getElementById('wish-message').value; 
    push(wishesRef, { name, message, timestamp: serverTimestamp() }).then(() => { 
        document.getElementById('wish-form').reset(); 
    }); 
});

onValue(wishesRef, (snapshot) => { 
    const wall = document.getElementById('sticky-wall'); wall.innerHTML = ''; 
    const data = snapshot.val(); 
    if (data) { 
        const messages = Object.values(data).reverse(); 
        messages.forEach((item, index) => { 
            const note = document.createElement('div'); 
            note.className = 'sticky-note'; 
            const rot = (Math.random() - 0.5) * 12; 
            const x = (index % 2 === 0 ? -1 : 1) * (Math.random() * 20); 
            const y = (Math.random() - 0.5) * 15; 
            note.style.setProperty('--note-rot', `${rot}deg`); 
            note.style.setProperty('--note-x', `${x}px`); 
            note.style.setProperty('--note-y', `${y}px`); 
            note.innerHTML = `<div class="note-text">${item.message}</div><div class="note-author">From: ${item.name}</div>`; 
            wall.appendChild(note); 
        }); 
    } 
});
</script>
<script>
if ('scrollRestoration' in history) { history.scrollRestoration = 'manual'; }
window.addEventListener('beforeunload', function () { window.scrollTo(0, 0); });
window.addEventListener('load', function () { window.scrollTo(0, 0); });

var fontsLoaded = false;
document.fonts.ready.then(function() {
    fontsLoaded = true;
    const hint = document.getElementById('printHint');
    if (hint) {
        hint.innerHTML = "點擊以列印相片";
        hint.classList.add('ready'); 
    }
});

var player;
var isPrinting = false; 
var targetDays = 0;
var hasAnimated = false;

function endIntro() {
    document.getElementById('intro-overlay').style.opacity = '0';
    document.getElementById('main-wrapper').classList.add('is-visible');
    document.body.style.overflow = "auto";
    document.documentElement.style.overflow = "auto";
    setTimeout(() => { document.getElementById('intro-overlay').style.display = 'none'; }, 1500);
}

function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
        videoId: 'pmrCXt4lNyA',
        playerVars: { 'autoplay': 0, 'loop': 1, 'playlist': 'pmrCXt4lNyA', 'controls': 0, 'playsinline': 1 },
        events: {
            'onStateChange': (e) => {
                document.getElementById('musicToggle').innerHTML = (e.data == 1) ? '||' : '▶';
            }
        }
    });
}

document.getElementById('musicToggle').onclick = function() {
    if (!player || typeof player.getPlayerState !== 'function') return;
    player.getPlayerState() == 1 ? player.pauseVideo() : player.playVideo();
};

document.getElementById('intro-overlay').addEventListener('click', function() {
    if (!fontsLoaded || isPrinting) return;
    isPrinting = true; 

    const photo          = document.getElementById('printPhoto');
    const hint           = document.getElementById('printHint');
    const wrapper        = document.getElementById('polaroid-wrapper');
    const flash          = document.getElementById('flash-effect');
    const sceneContainer = document.getElementById('scene-container');
    
    if (!photo || !hint || !wrapper || !flash || !sceneContainer) return;
    
    hint.classList.remove('ready');
    hint.style.opacity = '0';

    if (player && typeof player.playVideo === 'function') {
        try { player.playVideo(); } catch(e) {}
    }

    // 1. 閃光
    flash.classList.add('is-flashing');

    // 2. P3 開始印出
    setTimeout(() => {
        photo.classList.add('is-printing');
    }, 200);
    
    // 3. P3 顯影 + 鏡位往下平移，把藏在深處的 P2 帶進畫面
    setTimeout(() => { 
        photo.classList.add('is-developed'); 
        wrapper.classList.add('is-focusing'); 
        
        // 鏡頭往下大平移
        sceneContainer.classList.add('is-panning');
    }, 2700);

    // 4. 兩張照片展示完畢後，多停留一陣子再進主畫面
    setTimeout(() => { 
        endIntro(); 
    }, 9000); 
});

(function(){
    const year = 2026;
    const monthIndex = 5;
    const weddingDay = 20;
    const weddingDate = new Date(year, monthIndex, weddingDay, 11, 0, 0);

    const firstDay = new Date(year, monthIndex, 1);
    const firstWeekDay = firstDay.getDay();
    const nextMonthFirst = new Date(year, monthIndex + 1, 1);
    const lastDate = new Date(nextMonthFirst - 1).getDate();

    const today = new Date();
    const todayIsThisMonth = (today.getFullYear() === year && today.getMonth() === monthIndex);

    const bodyEl = document.getElementById('cd-calendar-body');
    if (!bodyEl) return;

    let html = '<div class="countdown-days-row">';
    let cellCount = 0;

    for (let i = 0; i < firstWeekDay; i++) {
        html += '<div class="countdown-day-cell cd-empty"></div>';
        cellCount++;
    }

    for (let d = 1; d <= lastDate; d++) {
        if (cellCount > 0 && cellCount % 7 === 0) {
            html += '</div><div class="countdown-days-row">';
        }
        let cls = 'cd-normal';
        if (todayIsThisMonth && d === today.getDate()) cls = 'cd-today';
        if (d === weddingDay) cls = 'cd-wedding';
        html += `<div class="countdown-day-cell ${cls}">${d}</div>`;
        cellCount++;
    }

    while (cellCount % 7 !== 0) {
        html += '<div class="countdown-day-cell cd-empty"></div>';
        cellCount++;
    }
    html += '</div>';
    bodyEl.innerHTML = html;

    const diffMs = weddingDate.getTime() - today.getTime();
    targetDays = Math.max(0, Math.ceil(diffMs / (1000 * 60 * 60 * 24)));
})();

function animateFlipClock(targetNumber) {
    if(targetNumber <= 0) return; 

    let current = 0;
    const tensEl = document.getElementById('digit-tens');
    const onesEl = document.getElementById('digit-ones');
    
    const interval = setInterval(() => {
        current += Math.ceil(targetNumber / 20); 
        if(current >= targetNumber) {
            current = targetNumber;
            clearInterval(interval);
        }

        let tens = Math.floor(current / 10);
        let ones = current % 10;
        
        if (tensEl.innerText != tens) {
            tensEl.innerText = tens;
            tensEl.classList.add('flipping');
            setTimeout(()=> tensEl.classList.remove('flipping'), 50);
        }
        if (onesEl.innerText != ones) {
            onesEl.innerText = ones;
            onesEl.classList.add('flipping');
            setTimeout(()=> onesEl.classList.remove('flipping'), 50);
        }

    }, 60);
}

window.addEventListener('scroll', () => {
    const section = document.getElementById('countdown-section');
    if (!section || hasAnimated) return;

    const rect = section.getBoundingClientRect();
    if (rect.top < window.innerHeight && rect.bottom >= 0) {
        hasAnimated = true;
        setTimeout(() => {
            animateFlipClock(targetDays);
        }, 500); 
    }
});
</script>
