<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jay & Michelle Wedding</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Noto+Serif+TC:wght@200;300;400&family=Monsieur+La+Doulaise&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
/* 核心樣式：回歸您指定的色調 */
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Serif TC',serif;background:#F7F6ED;color:#2c2c2c; overflow-x: hidden;} 

/* --- 照片開場：維持您的淡入效果 --- */
#intro-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
    background: #EBDDB5; z-index: 10000;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 1.8s ease;
}
.photo-stack { position: relative; width: 300px; height: 400px; cursor: pointer; }
.photo {
    position: absolute; left: 50%; width: 280px; height: 380px;
    background: #fff; border: 12px solid #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    transition: transform 2.8s cubic-bezier(0.25, 0.1, 0.25, 1), opacity 1.2s ease-out; 
    will-change: transform;
    background-size: cover; background-position: center;
}
.photo:nth-child(1) { transform: translateX(-50%) rotate(-4deg); z-index: 3; }
.photo:nth-child(2) { transform: translateX(-50%) rotate(2deg); z-index: 2; }
.photo:nth-child(3) { transform: translateX(-50%) rotate(-1deg); z-index: 1; }
.photo.dropped { transform: translateY(130vh) translateX(40px) rotate(35deg) !important; opacity: 0; }

/* --- 💎 主視覺：背景路徑與字體完全回歸 --- */
#main-wrapper { opacity: 0; transition: opacity 2s ease; }
.cover {
    height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    position: relative; overflow: hidden;
    /* 💎 請確保您的 GitHub 有上傳這張圖並命名為 bg_silk.jpg */
    background-image: url('bg_silk.jpg'); 
    background-size: cover;
    background-position: center;
    background-color: #F7F6ED; 
}

.name-container { position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; }

/* 💎 回歸 Monsieur La Doulaise */
.welcome-text {
    font-family: 'Monsieur La Doulaise', cursive;
    font-size: 4rem;
    color: #C9A466;
    margin-bottom: -10px;
    opacity: 0;
    animation: fadeInLast 2s forwards 1s; /* 最後淡入 */
}

/* 💎 回歸 Playfair Display */
.english-names {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.5rem, 8vw, 4.5rem);
    color: #2c2c2c;
    letter-spacing: 0.05em;
}

.chinese-names {
    display: flex; justify-content: space-between;
    width: 100%; padding: 0 10%; margin-top: 35px; 
    font-family: 'Noto Serif TC', serif; font-weight: 200; font-size: 1.2rem;
    letter-spacing: 0.5em; color: #4a4a4a;
}

@keyframes fadeInLast { from { opacity: 0; } to { opacity: 1; } }

/* 資訊與地圖區 */
section{padding: 80px 24px; max-width: 700px; margin: 0 auto; text-align: center;}
h2{font-family:'Cormorant Garamond',serif; font-size: 2rem; font-weight: 300; color: #C9A466; margin-bottom: 20px;}
.info{background: #fff; padding: 30px; margin: 20px 0; border: 1px solid #DDE7A9;}

/* 💎 地圖最終修復：使用官方嵌入語法 */
.map-container { width: 100%; height: 400px; margin: 20px 0; border: 1px solid #DDE7A9; overflow: hidden; }
iframe { width: 100%; height: 100%; border: 0; }

#musicToggle { position: fixed; bottom: 20px; right: 20px; width: 45px; height: 45px; border-radius: 50%; background: #C9A466; border: none; color: white; cursor: pointer; z-index: 9999; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>

<div id="intro-overlay">
    <div class="photo-stack">
        <div class="photo" onclick="dropPhoto(this)" style="background-image: url('p1.jpg');"></div>
        <div class="photo" onclick="dropPhoto(this)" style="background-image: url('p2.jpg');"></div>
        <div class="photo" onclick="dropPhoto(this)" style="background-image: url('p3.jpg');"></div>
    </div>
</div>

<div id="main-wrapper">
    <div class="cover">
        <div class="welcome-text">Welcome</div>
        <div class="name-container">
            <div class="english-names">Jay & Michelle's Wedding</div>
            <div class="chinese-names">
                <span>蔡宇杰</span>
                <span>陳旻瑄</span>
            </div>
        </div>
        <p style="margin-top: 30px; letter-spacing: 0.3em; color: #A6A35D;">2026·06·20</p>
    </div>

    <section>
        <h2>Wedding Info</h2>
        <div class="info">
            <h3 style="color:#C9A466; letter-spacing:0.2em; margin-bottom:10px">地點</h3>
            <p>暖居日穀 (台中市北屯區松竹路一段3號)</p>
        </div>
        <div class="map-container">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3640.165181186715!2d120.7042593!3d24.1668471!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x346917e8c459f471%3A0xc3c5f9f68e0d6b6!2z5pqW5bGF5pel56穀!5e0!3m2!1szh-TW!2stw!4v1710000000000" allowfullscreen="" loading="lazy"></iframe>
        </div>
    </section>
</div>

<div id="player" style="position:fixed; top:-9999px; left:-9999px;"></div>
<button id="musicToggle">▶</button>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
let droppedCount = 0;
var player;

function dropPhoto(el) {
    if (el.classList.contains('dropped')) return;
    if (droppedCount === 0 && player && player.playVideo) { player.playVideo(); }
    el.classList.add('dropped');
    droppedCount++;
    if (droppedCount === 3) {
        setTimeout(() => {
            document.getElementById('intro-overlay').style.opacity = '0';
            document.getElementById('main-wrapper').style.opacity = '1';
            document.body.style.overflow = 'auto'; 
            setTimeout(() => { document.getElementById('intro-overlay').style.display = 'none'; }, 2000);
        }, 1200);
    }
}

function onYouTubeIframeAPIReady() {
  player = new YT.Player('player', {
    videoId: 'pmrCXt4lNyA',
    playerVars: { 'autoplay': 1, 'loop': 1, 'playlist': 'pmrCXt4lNyA', 'controls': 0 },
    events: {
      'onReady': (e) => { e.target.setVolume(30); },
      'onStateChange': (e) => {
          document.getElementById('musicToggle').innerHTML = (e.data == 1) ? '||' : '▶';
      }
    }
  });
}

document.getElementById('musicToggle').addEventListener('click', function() {
  if (player && player.getPlayerState) {
    player.getPlayerState() == 1 ? player.pauseVideo() : player.playVideo();
  }
});
</script>
</body>
</html>
