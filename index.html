<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Jay & Michelle</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Playfair+Display:wght@400;700&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
/* 基礎設定 */
@font-face {
    font-family: 'my font';
    src: url('my%20font.ttf') format('truetype'); 
    font-display: swap; 
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

/* 💎 修正空白問題：確保 html 與 body 有高度但預設不鎖死 */
html, body { 
    width: 100%; 
    background: #faf8f5;
    -webkit-overflow-scrolling: touch;
}
body { 
    font-family: 'my font', 'Noto Serif TC', serif; 
    color: #2c2c2c; 
    overflow-x: hidden;
    overflow-y: hidden; /* 初始鎖定，由 JS 解開 */
}

/* --- 開場遮罩 --- */
#intro-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
    background: #e8dcc4; z-index: 10000;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 1s ease;
}

.camera-container {
    position: relative; width: 280px; height: 350px;
    background-image: url('camera.png'); background-size: contain; background-repeat: no-repeat;
    display: flex; align-items: center; justify-content: center;
}

.photo {
    width: 210px; height: 250px; background: #fff; border: 6px solid #fff; border-bottom: 25px solid #fff;
    box-shadow: 0 10px 20px rgba(0,0,0,0.1); cursor: pointer;
    background-image: url('P3.jpg'); background-size: cover; background-position: center;
    transition: transform 1s ease, opacity 1s ease;
}

/* --- 主頁面容器 --- */
#main-wrapper { 
    opacity: 0; visibility: hidden; width: 100%; 
    transition: opacity 1.5s ease;
}
#main-wrapper.is-visible { opacity: 1; visibility: visible; }

.cover { 
    height: 100vh; width: 100%; display: flex; flex-direction: column; 
    align-items: center; justify-content: center; text-align: center; 
    position: relative; background-color: #f5f5dc; 
}

/* 💎 字體樣式調整 */
.getting-married-text { 
    color:#c9a466; font-size: 3.4rem; font-family: 'DM Serif Display', serif;
    margin-bottom: 15px; position: relative; z-index: 10;
}

.english-names { font-family: 'Playfair Display', serif; font-size: 3rem; z-index: 10; }
.chinese-names { 
    display: flex; justify-content: space-around; width: 85%; max-width: 500px;
    margin-top: 30px; font-family: 'my font'; font-size: 4rem; color: #4a4a4a; z-index: 10;
}

/* 資訊區塊 (中文字體大兩倍) */
.info-section { padding: 80px 20px; text-align: center; background: #fbf9f7; }
.info-title { font-size: 3rem; color: #c9a466; margin-bottom: 20px; }
.info-text { font-family: 'my font'; font-size: 2.4rem; margin: 10px 0; }
.nav-btn { 
    display: inline-block; margin-top: 20px; padding: 15px 30px; 
    background: #fff; border: 1px solid #c9a466; color: #c9a466; 
    text-decoration: none; font-size: 2rem; font-family: 'my font';
}

/* 表單與留言板 (中文字體大兩倍) */
.form-group label { display: block; font-size: 2.2rem; margin-bottom: 10px; text-align: left; }
.form-group input { width: 100%; padding: 15px; font-size: 2rem; margin-bottom: 20px; }
.submit-btn { width: 100%; padding: 20px; background: #c9a466; color: #fff; border: none; font-size: 2.4rem; font-family: 'my font'; cursor: pointer; }

/* 留言板圖釘顏色 */
.sticky-note { width: 280px; padding: 40px 20px 20px; margin: 20px auto; position: relative; box-shadow: 3px 3px 10px rgba(0,0,0,0.1); }
.sticky-note::before { content: ""; position: absolute; top: -10px; left: 50%; width: 20px; height: 20px; background: #a82424; border-radius: 50%; transform: translateX(-50%); }
.sticky-note:nth-child(5n+1) { background-color: #C9A466; }
.sticky-note:nth-child(5n+2) { background-color: #EBDDB5; }
.sticky-note:nth-child(5n+3) { background-color: #F7F6ED; }
.sticky-note:nth-child(5n+4) { background-color: #DDE7A9; }
.sticky-note:nth-child(5n+5) { background-color: #A6A35D; }
.note-text { font-size: 2.2rem; margin-bottom: 10px; }
.note-author { font-size: 1.8rem; text-align: right; }

#musicToggle { position: fixed; bottom: 20px; right: 20px; z-index: 9999; width: 50px; height: 50px; background: #c9a466; color: #fff; border: none; border-radius: 50%; font-size: 1.2rem; }
</style>
</head>
<body>

<div id="intro-overlay">
    <div class="camera-container">
        <div class="photo" onclick="dropPhoto(this)"></div>
    </div>
</div>

<div id="main-wrapper">
    <div class="cover">
        <p class="getting-married-text">The Wedding of</p>
        <div class="english-names">Jay & Michelle</div>
        <div class="chinese-names"><span>蔡宇杰</span><span>陳旻瑄</span></div>
        <p style="margin-top: 30px; font-size: 1.8rem; color: #c9a466;">2026.06.20</p>
    </div>

    <section class="info-section">
        <h2 class="info-title">Wedding Info</h2>
        <p class="info-text">暖居日穀</p>
        <p style="font-size: 1.6rem; color: #888;">台中市北屯區松竹路一段3號</p>
        <a href="https://www.google.com/maps" target="_blank" class="nav-btn">開啟地圖導航</a>
    </section>

    <section class="info-section" style="background: #fff;">
        <h2 class="info-title" style="font-family: 'my font';">參加回覆</h2>
        <div style="max-width: 500px; margin: 0 auto;">
            <form>
                <div class="form-group">
                    <label>您的姓名</label>
                    <input type="text" required>
                </div>
                <button type="button" class="submit-btn">送出回覆</button>
            </form>
        </div>
    </section>

    <div id="sticky-wall" style="padding-bottom: 50px;">
        </div>

    <footer style="text-align:center; padding:50px; color:#c9a466; font-size: 2rem; font-style: italic;">See You Soon</footer>
</div>

<button id="musicToggle">▶</button>

<script>
function dropPhoto(el) {
    // 1. 動畫效果
    el.style.transform = "translateY(100px) rotate(10deg) scale(0.8)";
    el.style.opacity = "0";

    setTimeout(() => {
        // 2. 隱藏遮罩
        const overlay = document.getElementById('intro-overlay');
        overlay.style.opacity = '0';
        
        // 3. 顯示主內容
        const wrapper = document.getElementById('main-wrapper');
        wrapper.classList.add('is-visible');

        // 💎 4. 強制解除所有可能的捲動鎖定
        document.body.style.overflow = "auto";
        document.body.style.height = "auto";
        document.documentElement.style.overflow = "auto";
        document.documentElement.style.height = "auto";

        setTimeout(() => {
            overlay.style.display = 'none';
        }, 1000);
    }, 800);
}

// 簡單模擬留言板測試 (Firebase 邏輯請照舊)
const wall = document.getElementById('sticky-wall');
const demoWishes = [{name: "測試賓客", message: "祝新婚快樂！"}];
demoWishes.forEach(w => {
    const note = document.createElement('div');
    note.className = 'sticky-note';
    note.innerHTML = `<div class="note-text">${w.message}</div><div class="note-author">From: ${w.name}</div>`;
    wall.appendChild(note);
});
</script>
</body>
</html>
