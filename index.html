<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Jay & Michelle</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Noto+Serif+TC:wght@200;300;400;500;700&family=Gwendolyn:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Zen+Old+Mincho:wght@400;500&display=swap" rel="stylesheet">
<style>
@font-face {
    font-family: 'my font';
    src: url('my%20font.ttf') format('truetype'); 
    font-display: swap; 
}
*{margin:0;padding:0;box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
html, body { width: 100%; min-height: 100%; background: #faf8f5;}
body { font-family: 'my font', 'Noto Serif TC', serif; color: #2c2c2c; overflow-x: hidden; }

/* --- 開場：Polaroid 列印動畫 --- */
#intro-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #e8dcc4;
    z-index: 10000;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 1.5s ease-in-out;
    touch-action: none;
}
.camera-container {
    position: relative;
    width: min(340px, 80vw);
    aspect-ratio: 3 / 2;
    background-image: url('polaroid.png');   /* 這裡改成 .jpg */
    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
}

/* 出片口 */
.print-slot {
    position: absolute;
    left: 50%;
    bottom: 13%;
    transform: translateX(-50%);
    width: 64%;
    height: 0;
    overflow: hidden;
}
.print-photo {
    width: 100%;
    aspect-ratio: 3 / 4;
    background: #fff;
    border-radius: 6px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.25);
    opacity: 0;
    transform: translateY(-100%);
}
.print-photo-inner {
    width: 100%;
    height: 100%;
    background-image: url('P3.jpg');
    background-size: cover;
    background-position: center;
    filter: brightness(0.1) saturate(0.1);
}
.print-slot.is-open {
    animation: slotOpen 0.4s forwards;
}
@keyframes slotOpen {
    from { height: 0; }
    to   { height: 90%; }
}
.print-photo.is-printing {
    animation: photoPrint 2.3s forwards;
}
@keyframes photoPrint {
    0%   { opacity: 0; transform: translateY(-100%); }
    20%  { opacity: 1; transform: translateY(-80%); }
    100% { opacity: 1; transform: translateY(0%); }
}
.print-photo.is-developed .print-photo-inner {
    animation: developFade 4s forwards;
}
@keyframes developFade {
    0%   { filter: brightness(0.1) saturate(0.1); }
    40%  { filter: brightness(0.4) saturate(0.4); }
    70%  { filter: brightness(0.8) saturate(0.9); }
    100% { filter: brightness(1)   saturate(1); }
}
.print-hint {
    position: absolute;
    bottom: -40px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'my font';
    font-size: 1rem;
    letter-spacing: 0.2em;
    color: #8a7448;
    cursor: pointer;
    white-space: nowrap;
    animation: hintBlink 1.4s infinite;
}
@keyframes hintBlink {
    0%,100% { opacity: 1; }
    50%     { opacity: 0.4; }
}

/* --- 主視覺 --- */
#main-wrapper { opacity: 0; visibility: hidden; transition: opacity 2s ease; width: 100%; }
#main-wrapper.is-visible { opacity: 1; visibility: visible; }

.cover {
    height: 100vh; width: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; position: relative;
    overflow: hidden; background-color: #f5f5dc;
}
.cover::before {
    content: ""; position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    background-image: url('bg_silk.jpg.png');
    background-size: cover; background-position: center;
    z-index: 1;
}
.getting-married-text { 
    color:#c9a466; margin-bottom: 12px; letter-spacing: 0.4em;
    font-size: 0.9rem; z-index: 10; font-weight: 300;
    position: relative; font-family: 'my font', serif;
}
.name-container { position: relative; z-index: 10; width: 100%; }
.english-names { font-family: 'Playfair Display', serif; font-size: clamp(1.8rem, 6vw, 3.2rem); color: #2c2c2c; letter-spacing: 0.05em; }
.english-names .amp { font-family: 'Gwendolyn', cursive; font-size: clamp(3.5rem, 10vw, 5.5rem); color: #c9a466; margin: 0 8px; vertical-align: middle; }
.chinese-names { display: flex; justify-content: space-around; width: 85%; max-width: 450px; margin: 25px auto 0; font-family: 'my font'; font-size: 2.2rem; letter-spacing: 0.2em; color: #4a4a4a; }

/* 倒數月曆 */
.countdown-section {
    padding: 70px 20px 50px;
    background: #fbf9f7;
    text-align: center;
}
.countdown-title {
    font-family: 'my font';
    color: #c9a466;
    letter-spacing: 0.3em;
    font-size: 2.2rem;
    font-weight: 700;
    margin-bottom: 10px;
}
.countdown-grid {
    max-width: 640px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    border: 1px solid #e0d9d0;
    box-shadow: 0 12px 28px rgba(0,0,0,0.08);
    padding: 28px 24px 24px;
}
.countdown-header {
    display: flex;
    justify-content: center;
    align-items: baseline;
    margin-bottom: 18px;
    font-family: 'my font';
    color: #c9a466;
}
.countdown-month {
    letter-spacing: 0.35em;
    font-size: 2.2rem;
    font-weight: 600;
}
.countdown-days-row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
    margin-bottom: 10px;
}
.countdown-day-label,
.countdown-day-cell {
    width: 100%;
    padding: 10px 0;
    text-align: center;
    font-family: 'my font';
    font-size: 1.4rem;
}
.countdown-day-label { color: #b79b6b; }
.countdown-day-cell {
    border-radius: 12px;
    color: #5a4a34;
}
.cd-empty { background: transparent; }
.cd-normal { background: #f5eee3; }
.cd-today {
    background: #c9a466;
    color: #fff;
    font-weight: 600;
}
.cd-wedding {
    background: #f2e3cf;
    color: #2c2c2c;
    font-weight: 700;
    position: relative;
    box-shadow: 0 0 0 0 rgba(201,164,102,0.5);
    animation: weddingPulse 1.8s infinite;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
}
.cd-wedding::after {
    content: "♥";
    position: static;
    font-size: 0.9rem;
    color: #000;
}
@keyframes weddingPulse {
    0%   { transform: scale(1);   box-shadow: 0 0 0 0 rgba(201,164,102,0.4); }
    50%  { transform: scale(1.06);box-shadow: 0 0 0 10px rgba(201,164,102,0); }
    100% { transform: scale(1);   box-shadow: 0 0 0 0 rgba(201,164,102,0); }
}
.countdown-footer {
    margin-top: 16px;
    font-family: 'my font';
    font-size: 0.95rem;
    color: #777;
}

/* Info / Form / Notes 同前一版，略 */
.info-section { padding: 80px 20px; background: #fbf9f7; text-align: center; }
.info-card { max-width: 600px; background: #fff; padding: 40px 20px; margin: 30px auto; border: 1px solid #e0d9d0; }
.map-container { width: 100%; height: 350px; margin: 25px 0; border: 1px solid #e0d9d0; border-radius: 8px; overflow: hidden; }

.form-section { padding: 80px 20px; text-align: center; }
.form-card { max-width: 550px; background: #fff; padding: 40px 30px; margin: 0 auto; border: 1px solid #e0d9d0; border-radius: 12px; }
.form-group { margin-bottom: 30px; text-align: left; }
.form-group label { display: block; font-family: 'my font'; font-size: 1.1rem; margin-bottom: 10px; color: #444; }
.form-group input[type="text"], .form-group textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-family: 'my font'; font-size: 1rem; }
.radio-stack { display: flex; flex-direction: column; gap: 15px; margin-top: 10px; }
.radio-stack label { display: flex; align-items: center; font-size: 1.1rem; font-family: 'my font'; cursor: pointer; }
.radio-stack input { width: 18px; height: 18px; margin-right: 10px; }
.submit-btn { width: 100%; padding: 16px; background: #c9a466; color: #fff; border: none; font-family: 'my font'; font-size: 1.2rem; cursor: pointer; border-radius: 8px; }

.sticky-wall { display: flex; flex-wrap: wrap; justify-content: center; gap: 30px; padding: 40px 10px; max-width: 950px; margin: 0 auto; }
.sticky-note { 
    width: 210px; min-height: 190px; padding: 35px 20px 20px; box-shadow: 3px 6px 15px rgba(0,0,0,0.1); 
    position: relative; font-family: 'my font'; text-align: left; transition: 0.3s;
    transform: rotate(var(--note-rot)) translate(var(--note-x), var(--note-y));
}
.note-text { font-size: 1.1rem; line-height: 1.5; margin-bottom: 15px; color: #333; word-break: break-all; }
.note-author { font-size: 0.95rem; text-align: right; border-top: 1px dashed rgba(0,0,0,0.15); padding-top: 10px; }
.sticky-note::before { content: ""; position: absolute; top: -12px; left: 50%; transform: translateX(-50%); width: 24px; height: 24px; background-color: #a82424; border-radius: 50%; z-index: 2; }
.sticky-note:nth-child(5n+1) { background-color: #C9A466; }
.sticky-note:nth-child(5n+2) { background-color: #EBDDB5; }
.sticky-note:nth-child(5n+3) { background-color: #F7F6ED; }
.sticky-note:nth-child(5n+4) { background-color: #DDE7A9; }
.sticky-note:nth-child(5n+5) { background-color: #A6A35D; }

#musicToggle { position: fixed; bottom: 20px; right: 20px; width: 45px; height: 45px; border-radius: 50%; background: #c9a466; border: none; color: white; z-index: 9999; cursor: pointer; }
</style>
</head>
<body>

<div id="intro-overlay">
    <div class="camera-container" id="camera">
        <div class="print-slot" id="printSlot">
            <div class="print-photo" id="printPhoto">
                <div class="print-photo-inner"></div>
            </div>
        </div>
        <div class="print-hint" id="printHint">點擊以列印相片</div>
    </div>
</div>

<div id="main-wrapper">
    <!-- 下面維持不變，略 -->
    ...
</div>

<!-- 底下 JS 不變，沿用上一版 -->

</body>
</html>
