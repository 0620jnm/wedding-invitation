<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Jay & Michelle's Wedding</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Noto+Serif+TC:wght@200;300;400;500;700&family=Gwendolyn:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Zen+Old+Mincho:wght@400;500&display=swap" rel="stylesheet">
<style>
/* 💎 1. 字體與基礎定義 */
@font-face {
    font-family: 'my font';
    src: url('my%20font.ttf') format('truetype'); 
    font-display: swap; 
}
*{margin:0;padding:0;box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
html, body { width: 100%; height: 100%; overflow-x: hidden; background: #faf8f5;}
body { font-family: 'my font', 'Noto Serif TC', serif; color: #2c2c2c; }

/* --- 開場：拍立得 --- */
#intro-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #e8dcc4; z-index: 10000;
    display: flex; align-items: center; justify-content: center; transition: opacity 1.5s ease-in-out; touch-action: none;
}
.camera-container { position: relative; width: 280px; height: 340px; background-image: url('camera.png'); background-size: contain; background-position: center; background-repeat: no-repeat; z-index: 10001; }
.photo-stack { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); width: 220px; height: 260px; z-index: 10000; }
.photo {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: #fff; border: 6px solid #fff; border-bottom: 25px solid #fff;
    box-shadow: 0 5px 15px rgba(0,0,0,0.15); transition: transform 1.2s cubic-bezier(0.22, 1, 0.36, 1), opacity 1s ease-out;
    background-size: cover; background-position: center; opacity: 0; cursor: pointer; background-image: url('P3.jpg'); 
}
.photo:nth-child(1) { animation: printOut 1.2s forwards 0.3s; }
@keyframes printOut { from { opacity: 0; transform: translateY(-50px); } to { opacity: 1; transform: translateY(0); } }
.photo.dropped { transform: translateY(80px) scale(1.05) rotate(5deg) !important; opacity: 0 !important; filter: blur(15px); pointer-events: none; }

/* --- 主視覺 --- */
#main-wrapper { opacity: 0; visibility: hidden; transition: opacity 2s ease; }
#main-wrapper.is-visible { opacity: 1; visibility: visible; }
.cover { height: 100vh; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; position: relative; overflow: hidden; background-color: #f5f5dc; }
.cover::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url('bg_silk.jpg.png'); background-size: cover; background-position: center; z-index: 1; }

/* 💎 調整邀請文字：改為 2 倍大 */
.getting-married-text { 
    color:#c9a466; 
    margin-bottom: 20px; 
    letter-spacing: 0.3em; 
    font-size: 1.7rem; /* 從 0.85rem 調升至 1.7rem */
    z-index: 10; 
    position: relative; 
    font-family: 'my font', serif;
}

.name-container { position: relative; z-index: 10; width: 100%; }
.english-names { font-family: 'Playfair Display', serif; font-size: clamp(2.2rem, 7vw, 4rem); font-weight: 300; }
.english-names .amp { font-family: 'Gwendolyn', cursive; font-size: clamp(3.5rem, 10vw, 5.5rem); color: #c9a466; margin: 0 8px; vertical-align: middle; }
.chinese-names { display: flex; justify-content: space-around; width: 85%; max-width: 450px; margin: 25px auto 0; font-family: 'my font'; font-size: 2rem; letter-spacing: 0.2em; color: #4a4a4a; }

/* --- 資訊與地圖 --- */
.info-section { padding: 80px 20px; background: #fbf9f7; text-align: center; }
.countdown-container { display: flex; justify-content: center; gap: 10px; margin: 30px 0; }
.countdown-box { background-color: #c9a466; color: #fff; width: 65px; padding: 12px 0; border-radius: 6px; box-shadow: 0 4px 8px rgba(201,164,102,0.2); }
.calendar-wrapper { max-width: 320px; margin: 0 auto 40px; padding: 25px; background: #fff; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
.cal-day .highlight { background-color: #a82424; color: white; border-radius: 50%; width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; }
.info-card { max-width: 600px; background: #fff; padding: 40px 20px; margin: 30px auto; border: 1px solid #e0d9d0; }
.map-container { width: 100%; height: 350px; margin: 25px 0; border: 1px solid #e0d9d0; border-radius: 8px; overflow: hidden; }

/* --- 表單樣式 --- */
.form-section { padding: 80px 20px; text-align: center; }
.form-card { max-width: 550px; background: #fff; padding: 40px 30px; margin: 0 auto; border: 1px solid #e0d9d0; border-radius: 8px; }
.form-group { margin-bottom: 25px; text-align: left; }
.form-group label { display: block; font-family: 'my font'; font-size: 1.1rem; margin-bottom: 10px; color: #444; }
.form-group input, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; font-family: 'my font'; font-size: 1rem; }
.submit-btn { width: 100%; padding: 16px; background: #c9a466; color: #fff; border: none; font-family: 'my font'; font-size: 1.2rem; cursor: pointer; border-radius: 4px; }

/* --- 💎 留言板圖釘樣式 --- */
.sticky-wall { display: flex; flex-wrap: wrap; justify-content: center; gap: 30px; padding: 40px 10px; max-width: 950px; margin: 0 auto; }
.sticky-note { 
    width: 210px; min-height: 190px; padding: 35px 20px 20px; box-shadow: 3px 6px 15px rgba(0,0,0,0.1); 
    position: relative; font-family: 'my font'; text-align: left; transition: 0.3s;
    transform: rotate(var(--note-rot)) translate(var(--note-x), var(--note-y));
}
.sticky-note::before { content: ""; position: absolute; top: -12px; left: 50%; transform: translateX(-50%); width: 24px; height: 24px; background-color: #a82424; border-radius: 50%; box-shadow: 1px 2px 4px rgba(0,0,0,0.2), inset -2px -2px 4px rgba(0,0,0,0.3); z-index: 2; }
.sticky-note::after { content: ""; position: absolute; top: -5px; left: 50%; transform: translateX(-50%); width: 4px; height: 14px; background: #ccc; z-index: 1; }
/* 指定五色系 */
.sticky-note:nth-child(5n+1) { background-color: #C9A466; }
.sticky-note:nth-child(5n+2) { background-color: #EBDDB5; }
.sticky-note:nth-child(5n+3) { background-color: #F7F6ED; }
.sticky-note:nth-child(5n+4) { background-color: #DDE7A9; }
.sticky-note:nth-child(5n+5) { background-color: #A6A35D; }
@keyframes pinIn { from { transform: scale(1.4) translateY(-50px) rotate(0deg); opacity: 0; } to { transform: scale(1) translateY(0) rotate(var(--note-rot)); opacity: 1; } }
.new-note { animation: pinIn 0.7s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards; }
.note-text { font-size: 1.1rem; line-height: 1.5; min-height: 60px; margin-bottom: 15px; color: #333; }
.note-author { font-size: 0.95rem; text-align: right; border-top: 1px dashed rgba(0,0,0,0.15); padding-top: 10px; font-weight: bold; }

#musicToggle { position: fixed; bottom: 20px; right: 20px; width: 45px; height: 45px; border-radius: 50%; background: #c9a466; border: none; color: white; z-index: 9999; cursor: pointer; }
</style>
</head>
<body>

<div id="intro-overlay">
    <div class="camera-container"><div class="photo-stack"><div class="photo" onclick="dropPhoto(this)"></div></div></div>
</div>

<div id="main-wrapper">
    <div class="cover">
        <p class="getting-married-text">You're invited to</p>
        <div class="name-container">
            <div class="english-names">Jay <span class="amp">&</span> Michelle's Wedding</div>
            <div class="chinese-names"><span>蔡宇杰</span><span>陳旻瑄</span></div>
        </div>
        <p style="margin-top:25px; color:#c9a466; font-size: 1rem; letter-spacing: 0.3em; font-family: 'my font';">2026·06·20</p>
    </div>

    <section class="info-section">
        <h2 style="font-family:'Cormorant Garamond'; color:#c9a466; font-size: 2.5rem; margin-bottom: 10px;">Wedding Info</h2>
        <div class="countdown-container">
            <div class="countdown-box"><div id="cd-days">00</div><div style="font-size:0.7rem;">Days</div></div>
            <div class="countdown-box"><div id="cd-hours">00</div><div style="font-size:0.7rem;">Hrs</div></div>
            <div class="countdown-box"><div id="cd-minutes">00</div><div style="font-size:0.7rem;">Min</div></div>
            <div class="countdown-box"><div id="cd-seconds">00</div><div style="font-size:0.7rem;">Sec</div></div>
        </div>
        
        <div class="calendar-wrapper">
            <div style="font-family: 'Playfair Display'; font-size: 1.3rem; margin-bottom: 15px; color: #c9a466;">June 2026</div>
            <div style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; font-size: 1rem; color: #555;">
                <div style="color:#aaa;">M</div><div style="color:#aaa;">T</div><div style="color:#aaa;">W</div><div style="color:#aaa;">T</div><div style="color:#aaa;">F</div><div style="color:#c9a466;">S</div><div style="color:#c9a466;">S</div>
                <div>1</div><div>2</div><div>3</div><div>4</div><div>5</div><div>6</div><div>7</div>
                <div>8</div><div>9</div><div>10</div><div>11</div><div>12</div><div>13</div><div>14</div>
                <div>15</div><div>16</div><div>17</div><div>18</div><div>19</div><div><span class="highlight">20</span></div><div>21</div>
                <div>22</div><div>23</div><div>24</div><div>25</div><div>26</div><div>27</div><div>28</div><div>29</div><div>30</div>
            </div>
        </div>

        <div class="info-card">
            <p style="font-family: 'my font'; font-size: 1.2rem; color: #444;">暖居日穀</p>
            <p style="font-size: 0.9rem; color: #888; margin-top: 5px;">台中市北屯區松竹路一段3號</p>
            <div class="map-container">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3640.1654484920436!2d120.706312!3d24.1661661!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x346917f920800001%3A0x6a2c27076046e7f8!2z5pqW5bGF5pel56穀!5e0!3m2!1szh-TW!2stw!4v1710400000000!5m2!1szh-TW!2stw" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
            </div>
            <a href="https://maps.app.goo.gl/9R6V6X8Yw2rY7qQp7" target="_blank" style="display:inline-block; padding:12px 25px; border:1px solid #c9a466; color:#c9a466; text-decoration:none; font-family: 'my font'; font-size: 1rem; background:#fff;">開啟地圖導航</a>
        </div>
    </section>

    <section class="form-section">
        <h2 style="font-family:'my font'; color:#c9a466; font-size: 2.2rem; margin-bottom: 30px;">參加回覆表單</h2>
        <div class="form-card">
            <form id="rsvp-form">
                <div class="form-group">
                    <label>您的姓名</label>
                    <input type="text" id="guest-name" name="guest-name" placeholder="請輸入姓名" required>
                </div>
                <div class="form-group">
                    <label>是否參加婚禮？</label>
                    <div style="display:flex; gap: 20px; margin-top:10px;">
                        <label><input type="radio" name="attendance" value="yes" required> 是的，會參加</label>
                        <label><input type="radio" name="attendance" value="no" required> 抱歉，無法出席</label>
                    </div>
                </div>
                <button type="submit" class="submit-btn" id="rsvp-submit-btn">送出回覆</button>
            </form>
        </div>
    </section>

    <section class="form-section" style="background: #fbf9f7;">
        <h2 style="font-family:'my font'; color:#c9a466; font-size: 2.2rem; margin-bottom: 30px;">留言祝福</h2>
        <div class="form-card" style="margin-bottom: 50px;">
            <form id="wish-form">
                <div class="form-group">
                    <label>您的姓名</label>
                    <input type="text" id="wish-name" required placeholder="請輸入姓名">
                </div>
                <div class="form-group">
                    <label>祝福的話</label>
                    <textarea id="wish-message" required placeholder="寫些話給我們吧..." style="height: 100px;"></textarea>
                </div>
                <button type="submit" class="submit-btn">釘上祝福便條</button>
            </form>
        </div>
        <div class="sticky-wall" id="sticky-wall"></div>
    </section>

    <footer style="text-align:center; padding:80px 0; color:#c9a466; font-family:'Cormorant Garamond'; font-style:italic; font-size: 1.5rem;">See You Soon</footer>
</div>

<div id="player" style="position:fixed; top:-9999px;"></div>
<button id="musicToggle">▶</button>

<script src="https://www.youtube.com/iframe_api"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import { getDatabase, ref, push, onValue, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyAUFF7GdX7fAtK_wK5-YAffirtap52UgCg",
    authDomain: "wedding-e6351.firebaseapp.com",
    databaseURL: "https://wedding-e6351-default-rtdb.firebaseio.com",
    projectId: "wedding-e6351",
    storageBucket: "wedding-e6351.firebasestorage.app",
    messagingSenderId: "382633819825",
    appId: "1:382633819825:web:b3352f4f4e67423878ec90"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const wishesRef = ref(db, 'wishes');

document.getElementById('wish-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = document.getElementById('wish-name').value;
    const message = document.getElementById('wish-message').value;
    push(wishesRef, { name, message, timestamp: serverTimestamp() }).then(() => {
        document.getElementById('wish-form').reset();
    });
});

onValue(wishesRef, (snapshot) => {
    const wall = document.getElementById('sticky-wall');
    wall.innerHTML = '';
    const data = snapshot.val();
    if (data) {
        const messages = Object.values(data).reverse();
        messages.forEach((item, index) => {
            const note = document.createElement('div');
            note.className = 'sticky-note';
            const rot = (Math.random() - 0.5) * 12; 
            const x = (index % 2 === 0 ? -1 : 1) * (Math.random() * 20);
            const y = (Math.random() - 0.5) * 15;
            note.style.setProperty('--note-rot', `${rot}deg`);
            note.style.setProperty('--note-x', `${x}px`);
            note.style.setProperty('--note-y', `${y}px`);
            if(index === 0) note.classList.add('new-note');
            note.innerHTML = `<div class="note-text">${item.message}</div><div class="note-author">From: ${item.name}</div>`;
            wall.appendChild(note);
        });
    }
});
</script>

<script>
let droppedCount = 0; var player;
function dropPhoto(el) {
    if (el.classList.contains('dropped')) return;
    if (droppedCount === 0 && player && typeof player.playVideo === 'function') { player.playVideo(); }
    el.classList.add('dropped'); droppedCount++;
    setTimeout(() => {
        document.getElementById('intro-overlay').style.opacity = '0';
        document.getElementById('main-wrapper').classList.add('is-visible');
        setTimeout(() => { document.getElementById('intro-overlay').style.display = 'none'; }, 1500);
    }, 1200);
}

function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
        videoId: 'pmrCXt4lNyA',
        playerVars: { 'autoplay': 1, 'loop': 1, 'playlist': 'pmrCXt4lNyA', 'controls': 0, 'playsinline': 1 },
        events: { 'onStateChange': (e) => { document.getElementById('musicToggle').innerHTML = (e.data == 1) ? '||' : '▶'; } }
    });
}

function updateCountdown() {
    const weddingDate = new Date("June 20, 2026 12:00:00").getTime();
    const distance = weddingDate - new Date().getTime();
    if (distance < 0) return;
    document.getElementById("cd-days").innerText = Math.floor(distance / (1000 * 60 * 60 * 24)).toString().padStart(2, '0');
    document.getElementById("cd-hours").innerText = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
    document.getElementById("cd-minutes").innerText = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
    document.getElementById("cd-seconds").innerText = Math.floor((distance % (1000 * 60)) / 1000).toString().padStart(2, '0');
}
setInterval(updateCountdown, 1000); updateCountdown();

document.getElementById('musicToggle').onclick = function() {
    player.getPlayerState() == 1 ? player.pauseVideo() : player.playVideo();
};
</script>
</body>
</html>
