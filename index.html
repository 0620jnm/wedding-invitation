<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jay & Michelle Wedding Invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Noto+Serif+TC:wght@300;400&display=swap" rel="stylesheet">
<style>
    /* 全域設定 */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Noto Serif TC', serif; background: #faf8f5; color: #2c2c2c; line-height: 1.8; overflow: hidden; } /* 初始隱藏捲軸 */
    
    /* --- 精緻擬真信封區塊 --- */
    #envelope-wrapper {
        position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
        background: radial-gradient(circle, #4a3f35 0%, #1a1614 100%); /* 深色背景營造儀式感 */
        display: flex; align-items: center; justify-content: center;
        z-index: 10000; transition: opacity 1s ease 1.5s; perspective: 1000px;
    }
    .envelope-container {
        position: relative; width: 350px; height: 240px; cursor: pointer;
        perspective: 1000px; /* 為翻蓋創造立體感 */
    }
    .envelope-container:hover { transform: translateY(-5px) scale(1.02); }

    /* --- 1. 全實體擬真信封照片 --- */
    .envelope-base {
        position: absolute; width: 100%; height: 100%;
        /* 替換為高品質手工紙信封實體照片 (去背PNG) */
        background-image: url('https://i.imgur.com/vHqB3qf.png'); 
        background-size: cover; background-position: center;
        box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        border-radius: 5px; z-index: 1;
    }
    
    /* 信封翻蓋 (實體照片) */
    .envelope-flap {
        position: absolute; top: 0; left: 0; width: 100%; height: 50%; /* 翻蓋高度 */
        /* 替換為對應的信封翻蓋實體照片 (去背PNG) */
        background-image: url('https://i.imgur.com/GzBvY4P.png');
        background-size: cover; background-position: top;
        transform-origin: top;
        transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 3;
    }

    /* --- 2. 實體封蠟與乾燥花束 --- */
    #seal-group {
        position: absolute; top: 35%; left: 50%; transform: translateX(-50%);
        z-index: 10; transition: all 0.8s ease; display: flex; flex-direction: column; align-items: center;
        pointer-events: none; /* 防止擋住信封點擊 */
    }
    
    /* 乾燥花束 (高品質去背PNG) */
    .dried-flowers {
        width: 150px; height: auto; margin-bottom: -35px; /* 讓封蠟蓋在花上 */
        filter: drop-shadow(0 5px 10px rgba(0,0,0,0.3));
        /* 這裡預設了一個優雅的乾燥花束素材連結 */
        content: url('https://i.imgur.com/HnNqH4G.png'); 
    }
    
    /* 立體蜂蠟封印 (高品質去背PNG，看起來要有立體感與光澤) */
    .wax-seal {
        width: 75px; height: 75px;
        filter: drop-shadow(0 6px 12px rgba(80,0,0,0.6));
        /* 這裡預設了一個立體的古銅色封蠟素材連結 (你可以換成有名字縮寫的) */
        content: url('https://i.imgur.com/4gC9qB8.png');
    }

    /* --- 打開後的動畫狀態 --- */
    .envelope-container.open .envelope-flap { transform: rotateX(170deg); z-index: 0; }
    .envelope-container.open #seal-group { opacity: 0; transform: translateX(-50%) translateY(30px); }

    /* --- 網頁主內容控制 --- */
    #main-content { opacity: 0; transform: translateY(100vh); transition: all 1.5s ease; }
    #main-content.reveal { opacity: 1; transform: translateY(0); }

    /* 原有樣式優化 */
    .cover { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #faf8f5; text-align: center; }
    .cover h1 { font-family: 'Cormorant Garamond', serif; font-size: clamp(2.8rem, 10vw, 5.5rem); font-weight: 300; margin: 15px 0; letter-spacing: 0.05em; }
    section { padding: 60px 24px; max-width: 600px; margin: 0 auto; text-align: center; }
    .info { background: #fff; padding: 30px; margin: 20px 0; border-radius: 20px; border: 1px solid #eee; }
    .btn-nav { display: inline-block; padding: 12px 35px; background: #8d705a; color: #fff; text-decoration: none; border-radius: 30px; margin-top: 20px; }
    .music-btn { position: fixed; bottom: 20px; right: 20px; width: 50px; height: 50px; border-radius: 50%; background: #c9a96e; border: none; color: white; cursor: pointer; z-index: 999; }
</style>
</head>
<body>

<div id="envelope-wrapper">
    <div class="envelope-container" id="envContainer" onclick="openEnvelope()">
        <div class="envelope-base"></div>
        <div class="envelope-flap"></div>
        
        <div id="seal-group">
            <img class="dried-flowers">
            <img class="wax-seal">
        </div>
    </div>
    <p style="position: absolute; bottom: 18%; color: #c9a96e; letter-spacing: 3px; font-size: 14px;">TAP TO OPEN</p>
</div>

<div id="main-content">
    <div class="cover">
        <p style="color:#c9a96e; letter-spacing:5px;">WE ARE GETTING MARRIED</p>
        <h1>Jay <span style="font-style:italic;color:#c9a96e;">&</span> Michelle</h1>
        <p>2026 / 06 / 20</p>
    </div>

    <section>
        <h2 style="color:#c9a96e; font-family:serif; margin-bottom:20px;">誠摯邀請</h2>
        <p>我們即將開啟人生新的篇章，<br>誠摯邀請您與我們一同分享這份喜悅。</p>
        
        <div class="info">
            <p style="font-size:0.8rem; color:#888;">DATE</p>
            <p style="font-size:1.4rem;">2026.06.20 (Sat)</p>
        </div>
        <div class="info">
            <p style="font-size:0.8rem; color:#888;">VENUE</p>
            <p>暖居日穀<br>台中市北屯區松竹路一段3號</p>
        </div>
        
        <div style="margin:40px 0;">
            <div style="border-radius:20px; overflow:hidden; border:1px solid #eee;">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3639.467406987157!2d120.7061324!3d24.1729019!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x346917865f375555%3A0x6b77c5d5a6c0c6c0!2z5pqW5bGF5pel56穀!5e0!3m2!1szh-TW!2stw!4v17000000000003" width="100%" height="300" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
            </div>
            <a href="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3639.467406987157!2d120.7061324!3d24.1729019!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x346917865f375555%3A0x6b77c5d5a6c0c6c0!2z5pqW5bGF5pel56穀!5e0!3m2!1szh-TW!2stw!4v17000000000004" target="_blank" class="btn-nav">開啟 Google 地圖導航</a>
        </div>
    </section>

    <footer style="padding:100px 0; color:#c9a96e; font-style:italic; font-size:1.5rem;">
        See You Soon
    </footer>
</div>

<div id="player" style="position:fixed;top:-999px;left:-999px;"></div>
<button id="musicToggle" class="music-btn">▶</button>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
    function openEnvelope() {
        document.getElementById('envContainer').classList.add('open');
        setTimeout(() => {
            document.getElementById('main-content').classList.add('reveal');
            document.body.style.overflow = 'auto';
            if (player) player.playVideo();
        }, 1200);
        setTimeout(() => {
            document.getElementById('envelope-wrapper').style.opacity = '0';
        }, 1800);
        setTimeout(() => {
            document.getElementById('envelope-wrapper').style.display = 'none';
        }, 3200);
    }

    var player;
    function onYouTubeIframeAPIReady() {
        player = new YT.Player('player', {
            videoId: 'pmrCXt4lNyA',
            playerVars: { 'autoplay': 0, 'loop': 1, 'playlist': 'pmrCXt4lNyA' },
            events: { 'onStateChange': (e) => {
                document.getElementById('musicToggle').innerHTML = (e.data == 1) ? '⏸' : '▶';
            }}
        });
    }
    document.getElementById('musicToggle').onclick = () => {
        player.getPlayerState() == 1 ? player.pauseVideo() : player.playVideo();
    };
</script>
</body>
</html>
