<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Jay & Michelle's Wedding</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Noto+Serif+TC:wght@200;300;400;500;700&family=Gwendolyn:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Zen+Old+Mincho:wght@400;500&display=swap" rel="stylesheet">
<style>
/* 💎 1. 字體與基礎設定 */
@font-face {
    font-family: 'my font';
    src: url('my%20font.ttf') format('truetype'); 
    font-display: swap; 
}

*{margin:0;padding:0;box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
html, body { width: 100%; height: 100%; height: -webkit-fill-available; overflow-x: hidden; background: #faf8f5;}
body { font-family: 'my font', 'Noto Serif TC', serif; color: #2c2c2c; } 

/* --- 開場遮罩 (Intro Overlay) --- */
#intro-overlay { 
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #e8dcc4; z-index: 10000; 
    display: flex; align-items: center; justify-content: center; transition: opacity 1.5s ease-in-out; 
    touch-action: none; 
}
.camera-container { position: relative; width: 280px; height: 340px; background-image: url('camera.png'); background-size: contain; background-position: center; background-repeat: no-repeat; z-index: 10001; }
.photo-stack { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); width: 220px; height: 260px; z-index: 10000; }
/* 💎 修正照片檔名為 P3.jpg */
.photo { 
    position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: #fff; border: 6px solid #fff; border-bottom: 25px solid #fff; 
    box-shadow: 0 5px 15px rgba(0,0,0,0.15); transition: transform 1.2s cubic-bezier(0.22, 1, 0.36, 1), opacity 1.2s ease-out, filter 1.5s ease-out; 
    background-size: cover; background-position: center; opacity: 0; cursor: pointer;
    background-image: url('P3.jpg'); 
}
.photo:nth-child(1) { animation: printOut 1.2s forwards 0.3s; z-index: 1; --rot: 0deg; --slide: 0px; }
@keyframes printOut { from { opacity: 0; transform: translateY(-50px) rotate(0deg); } to { opacity: 1; transform: translateY(var(--slide)) rotate(var(--rot)); } }
.photo.dropped { transform: scale(1.1) translateY(-20px) !important; opacity: 0 !important; filter: blur(20px) !important; pointer-events: none; }

/* --- 主網頁內容 (Main Wrapper) --- */
#main-wrapper { opacity: 0; visibility: hidden; transition: opacity 2s ease; }
#main-wrapper.is-visible { opacity: 1; visibility: visible; }

.cover { height: 100vh; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; position: relative; overflow: hidden; background-color: #f5f5dc; }
.cover::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url('bg_silk.jpg.png'); background-size: cover; background-position: center; z-index: 1; }
.chinese-names { display: flex; justify-content: space-around; width: 85%; max-width: 450px; margin: 25px auto 0; font-family: 'my font', serif; font-size: 2.5rem; letter-spacing: 0.2em; color: #4a4a4a; z-index: 10; position: relative; }
.english-names { font-family: 'Playfair Display', serif; font-size: clamp(2.2rem, 7vw, 4rem); font-weight: 300; z-index: 10; position: relative; }
.english-names .amp { font-family: 'Gwendolyn', cursive; font-size: clamp(3.5rem, 10vw, 5.5rem); color: #c9a466; margin: 0 8px; vertical-align: middle; }

/* 倒數計時 & 月曆 */
.info-section { padding: 60px 20px; background: #fbf9f7; text-align: center; }
.countdown-container { display: flex; justify-content: center; gap: 12px; margin: 25px 0; }
.countdown-box { background: #c9a466; color: #fff; width: 65px; height: 80px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.countdown-number { font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: bold; }
.calendar-wrapper { max-width: 320px; margin: 0 auto 30px auto; padding: 25px; background: rgba(255, 255, 255, 0.8); border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
.calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px 0; font-family: 'Playfair Display', serif; }
.highlight { background-color: #a82424; color: white; border-radius: 50%; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; margin: 0 auto; }

/* 留言板與表單 */
.form-card { max-width: 500px; background: #fff; padding: 30px; margin: 20px auto; border: 1px solid #e0d9d0; }
.submit-btn { width: 100%; padding: 15px; background: #c9a466; color: #fff; border: none; cursor: pointer; font-family: 'my font', serif; font-size: 1.2rem; }
.sticky-wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; padding: 20px; max-width: 900px; margin: 0 auto; }
.sticky-note { padding: 18px; box-shadow: 2px 3px 10px rgba(0,0,0,0.1); font-family: 'my font', serif; text-align: left; background-color: #fdf5c9; transform: rotate(-1deg); }

#musicToggle { position: fixed; bottom: 20px; right: 20px; width: 40px; height: 40px; border-radius: 50%; background: #c9a466; border: none; color: white; z-index: 9999; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>

<div id="intro-overlay">
    <div class="camera-container">
        <div class="photo-stack">
            <div class="photo" onclick="dropPhoto(this)"></div>
        </div>
    </div>
</div>

<div id="main-wrapper">
    <div class="cover">
        <p style="color:#c9a466; letter-spacing:0.4em; font-size: 0.85rem; z-index: 10; position: relative;">WE'RE GETTING MARRIED</p>
        <div class="name-container">
            <div class="english-names">Jay <span class="amp">&</span> Michelle</div>
            <div class="chinese-names"><span>蔡宇杰</span><span>陳旻瑄</span></div>
        </div>
        <p style="margin-top:20px; color:#888; font-size: 0.9rem; z-index: 10; position: relative;">2026·06·20</p>
    </div>

    <section class="info-section">
        <h2 style="color:#c9a466; font-size: 2.2rem; margin-bottom: 25px;">Wedding Info</h2>
        <p style="font-family:'my font'; margin-bottom:10px;">2026年6月20日 星期六</p>
        
        <div class="countdown-container">
            <div class="countdown-box"><div class="countdown-number" id="cd-days">00</div><div style="font-size:0.7rem;">天</div></div>
            <div class="countdown-box"><div class="countdown-number" id="cd-hours">00</div><div style="font-size:0.7rem;">時</div></div>
            <div class="countdown-box"><div class="countdown-number" id="cd-minutes">00</div><div style="font-size:0.7rem;">分</div></div>
            <div class="countdown-box"><div class="countdown-number" id="cd-seconds">00</div><div style="font-size:0.7rem;">秒</div></div>
        </div>

        <div class="calendar-wrapper">
            <div class="calendar-grid">
                <div>1</div><div>2</div><div>3</div><div>4</div><div>5</div><div>6</div><div>7</div>
                <div>8</div><div>9</div><div>10</div><div>11</div><div>12</div><div>13</div><div>14</div>
                <div>15</div><div>16</div><div>17</div><div>18</div><div>19</div><div><div class="highlight">20</div></div><div>21</div>
                <div>22</div><div>23</div><div>24</div><div>25</div><div>26</div><div>27</div><div>28</div>
                <div>29</div><div>30</div>
            </div>
        </div>
    </section>

    <section style="padding: 60px 20px; text-align: center;">
        <h2 style="color:#c9a466; margin-bottom: 30px;">RSVP 參加回覆</h2>
        <div class="form-card">
            <form id="rsvp-form">
                <input type="text" id="guest-name" placeholder="您的姓名" style="width:100%; padding:12px; margin-bottom:15px; border:1px solid #ddd;" required>
                <div style="margin-bottom: 15px; text-align: left;">
                    <label><input type="radio" name="attendance" value="yes" required> 會參加</label>
                    <label style="margin-left: 20px;"><input type="radio" name="attendance" value="no"> 無法參加</label>
                </div>
                <button type="submit" class="submit-btn" id="rsvp-submit-btn">送出回覆</button>
            </form>
        </div>
    </section>

    <section style="padding: 60px 20px; text-align: center; background: #fbf9f7;">
        <h2 style="color:#c9a466; margin-bottom: 30px;">留言祝福</h2>
        <div class="form-card">
            <form id="wish-form">
                <input type="text" id="wish-name" placeholder="您的姓名" style="width:100%; padding:10px; margin-bottom:15px; border:1px solid #ddd;" required>
                <textarea id="wish-message" placeholder="寫些話給我們吧..." style="width:100%; padding:10px; margin-bottom:15px; border:1px solid #ddd; min-height:80px;" required></textarea>
                <button type="submit" class="submit-btn">送出祝福</button>
            </form>
        </div>
        <div class="sticky-wall" id="sticky-wall"></div>
    </section>

    <footer style="text-align:center; padding:50px 0; color:#c9a466; font-style:italic;">See You Soon</footer>
</div>

<div id="player" style="position:fixed; top:-9999px;"></div>
<button id="musicToggle">▶</button>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  import { getDatabase, ref, push, onValue, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";
  const firebaseConfig = { apiKey: "AIzaSyAUFF7GdX7fAtK_wK5-YAffirtap52UgCg", authDomain: "wedding-e6351.firebaseapp.com", databaseURL: "https://wedding-e6351-default-rtdb.firebaseio.com", projectId: "wedding-e6351", storageBucket: "wedding-e6351.firebasestorage.app", messagingSenderId: "382633819825", appId: "1:382633819825:web:b3352f4f4e67423878ec90" };
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const wishesRef = ref(db, 'wishes');

  document.getElementById('wish-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('wish-name').value;
      const message = document.getElementById('wish-message').value;
      push(wishesRef, { name, message, timestamp: serverTimestamp() }).then(() => { alert('送出成功！'); document.getElementById('wish-form').reset(); });
  });

  onValue(wishesRef, (snapshot) => {
      const wall = document.getElementById('sticky-wall'); wall.innerHTML = '';
      const data = snapshot.val();
      if (data) {
          Object.values(data).reverse().forEach(item => {
              const note = document.createElement('div'); note.className = 'sticky-note';
              note.innerHTML = `<div class="note-text">${item.message}</div><div class="note-author">From: ${item.name}</div>`;
              wall.appendChild(note);
          });
      }
  });
</script>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
let droppedCount = 0; var player;

// 💎 照片點擊解鎖邏輯
function dropPhoto(el) {
    if (el.classList.contains('dropped')) return;
    
    // 1. 播放音樂
    if (player && typeof player.playVideo === 'function') { player.playVideo(); }
    
    // 2. 觸發動畫
    el.classList.add('dropped');
    droppedCount++;
    
    // 3. 解鎖主網頁並移走遮罩層
    setTimeout(() => {
        const overlay = document.getElementById('intro-overlay');
        overlay.style.opacity = '0';
        overlay.style.pointerEvents = 'none'; // 💎 關鍵：讓遮罩不再擋住下方的點擊
        document.getElementById('main-wrapper').classList.add('is-visible');
        setTimeout(() => { overlay.style.display = 'none'; }, 1500);
    }, 800);
}

function onYouTubeIframeAPIReady() {
  player = new YT.Player('player', {
    videoId: 'pmrCXt4lNyA',
    playerVars: { 'autoplay': 1, 'loop': 1, 'playlist': 'pmrCXt4lNyA', 'controls': 0, 'playsinline': 1 },
    events: { 'onReady': (e) => { e.target.setVolume(30); }, 'onStateChange': (e) => { document.getElementById('musicToggle').innerHTML = (e.data == 1) ? '||' : '▶'; } }
  });
}

// RSVP 表單傳送
const rsvpForm = document.getElementById('rsvp-form');
const scriptURL = 'https://script.google.com/macros/s/AKfycbz2N6On1QHoE5q06e4NQsOYVkJJQ8PMl8kSIqx4MSbpJZgI2Qe3DbnM4HJWv2Mp594iPw/exec';
rsvpForm.addEventListener('submit', e => {
    e.preventDefault();
    document.getElementById('rsvp-submit-btn').innerText = '傳送中...';
    const url = scriptURL + '?guest-name=' + encodeURIComponent(document.getElementById('guest-name').value) + '&attendance=' + encodeURIComponent(document.querySelector('input[name="attendance"]:checked').value);
    fetch(url, { method: 'GET', mode: 'no-cors' }).then(() => {
        alert('回覆成功！'); rsvpForm.reset(); document.getElementById('rsvp-submit-btn').innerText = '送出回覆';
    });
});

function updateCountdown() {
    const weddingDate = new Date("June 20, 2026 12:00:00").getTime();
    const distance = weddingDate - new Date().getTime();
    if (distance < 0) return;
    document.getElementById("cd-days").innerText = Math.floor(distance / (1000 * 60 * 60 * 24)).toString().padStart(2, '0');
    document.getElementById("cd-hours").innerText = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
    document.getElementById("cd-minutes").innerText = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
    document.getElementById("cd-seconds").innerText = Math.floor((distance % (1000 * 60)) / 1000).toString().padStart(2, '0');
}
setInterval(updateCountdown, 1000); updateCountdown();

document.getElementById('musicToggle').onclick = function() {
  if (player && typeof player.getPlayerState === 'function') {
    player.getPlayerState() == 1 ? player.pauseVideo() : player.playVideo();
  }
};
</script>
</body>
</html>
