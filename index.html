<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Jay & Michelle</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Noto+Serif+TC:wght@200;300;400&family=Gwendolyn:wght@400;700&family=Playfair+Display:ital,wght@0,400;1,400&family=Zen+Old+Mincho:wght@400;500&display=swap" rel="stylesheet">
<style>
/* 基礎修正：解決手機版高度與捲動問題 */
*{margin:0;padding:0;box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
html, body { width: 100%; height: 100%; height: -webkit-fill-available; overflow-x: hidden; background: #faf8f5;}
body{font-family:'Noto Serif TC',serif; color:#2c2c2c; position: relative;} 

/* --- 💎 開場：拍立得 --- */
#intro-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #e8dcc4; z-index: 10000;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 1.5s ease-in-out; 
    touch-action: none; /* 防止滑動干擾點擊 */
}
.camera-container {
    position: relative; width: 280px; height: 340px;
    background-image: url('camera.png'); background-size: contain; background-position: center; background-repeat: no-repeat;
    z-index: 10001;
}
.photo-stack { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); width: 220px; height: 260px; z-index: 10000; }
.photo {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    background: #fff; border: 6px solid #fff; border-bottom: 25px solid #fff;
    box-shadow: 0 5px 15px rgba(0,0,0,0.15);
    transition: transform 1.2s cubic-bezier(0.22, 1, 0.36, 1), opacity 1.2s ease-out, filter 1.2s; 
    background-size: cover; background-position: center; opacity: 0;
    cursor: pointer;
}

/* 動態滑出 */
.photo:nth-child(1) { animation: printOut 1.2s forwards 0.3s; z-index: 3; --rot: -5deg; --slide: 20px; }
.photo:nth-child(2) { animation: printOut 1.2s forwards 0.6s; z-index: 2; --rot: 3deg; --slide: 10px; }
.photo:nth-child(3) { animation: printOut 1.2s forwards 0.9s; z-index: 1; --rot: 0deg; --slide: 0px; }

@keyframes printOut { 
    from { opacity: 0; transform: translateY(-50px) rotate(0deg); } 
    to { opacity: 1; transform: translateY(var(--slide)) rotate(var(--rot)); } 
}

/* 💎 點擊後：影像慢慢淡出特效 */
.photo.dropped { 
    transform: translateY(-20px) scale(1.1) rotate(5deg) !important; 
    opacity: 0 !important; 
    filter: blur(10px); /* 增加模糊感讓淡出更美 */
    pointer-events: none; 
}

/* --- 💎 主視覺 --- */
#main-wrapper { opacity: 0; visibility: hidden; transition: opacity 2s ease; }
#main-wrapper.is-visible { opacity: 1; visibility: visible; }

.cover {
    height: 100vh; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    position: relative; overflow: hidden; background-color: #f5f5dc; 
}
.cover::before {
    content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background-image: url('bg_silk.jpg.png'); background-size: cover; background-position: center;
    z-index: 1;
}

.getting-married-text { color:#c9a466; margin-bottom:12px; letter-spacing:0.4em; font-size: 0.85rem; z-index: 10; position: relative;}

.name-container { position: relative; z-index: 10; width: 100%; }
.english-names { font-family: 'Playfair Display', serif; font-size: clamp(2.2rem, 7vw, 4rem); font-weight: 300; }
.english-names .amp { font-family: 'Gwendolyn', cursive; font-size: clamp(3.5rem, 10vw, 5.5rem); color: #c9a466; margin: 0 8px; vertical-align: middle; }

/* 💎 若要修改中文姓名「蔡宇杰、陳旻瑄」的字體，請修改這裡的 font-family */
.chinese-names { 
    display: flex; justify-content: space-around; width: 85%; max-width: 450px; margin: 25px auto 0; 
    font-family: 'Zen Old Mincho', serif; font-size: 2rem; letter-spacing: 0.2em; color: #4a4a4a; 
}

/* 內容區 */
.content-section { padding: 50px 20px; max-width: 1000px; margin: 0 auto; }
.grid-row { display: flex; flex-direction: column; gap: 30px; margin-bottom: 60px; }
.grid-images { display: flex; gap: 10px; width: 100%; }
.grid-img { flex: 1; height: 250px; background-size: cover; background-position: center; border: 5px solid #fff; box-shadow: 0 3px 10px rgba(0,0,0,0.05); }
.grid-text h3 { font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; color: #c9a466; margin-bottom: 10px; }

/* 婚禮資訊 */
.info-section { padding: 60px 20px; background: #fbf9f7; text-align: center; }
.info-card { background: #fff; padding: 30px; margin: 20px auto; border: 1px solid #e0d9d0; }
.map-container { width: 100%; height: 300px; margin: 20px 0; border: 1px solid #e0d9d0; }

#musicToggle { position: fixed; bottom: 20px; right: 20px; width: 40px; height: 40px; border-radius: 50%; background: #c9a466; border: none; color: white; cursor: pointer; z-index: 9999; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body onload="checkImages()">

<div id="intro-overlay">
    <div class="camera-container">
        <div class="photo-stack">
            <div class="photo" onclick="dropPhoto(this)" style="background-image: url('p1.jpg');"></div>
            <div class="photo" onclick="dropPhoto(this)" style="background-image: url('p2.jpg');"></div>
            <div class="photo" onclick="dropPhoto(this)" style="background-image: url('p3.jpg');"></div>
        </div>
    </div>
</div>

<div id="main-wrapper">
    <div class="cover">
        <p class="getting-married-text">WE'RE GETTING MARRIED</p>
        <div class="name-container">
            <div class="english-names">Jay <span class="amp">&</span> Michelle</div>
            <div class="chinese-names"><span>蔡宇杰</span><span>陳旻瑄</span></div>
        </div>
        <p style="margin-top:20px; color:#888; letter-spacing:0.2em; font-size: 0.9rem; z-index: 10; position: relative;">2026·06·20</p>
    </div>

    <section class="content-section">
        <div class="grid-row">
            <div class="grid-images">
                <div class="grid-img" style="background-image: url('story1a.jpg');"></div>
                <div class="grid-img" style="background-image: url('story1b.jpg');"></div>
            </div>
            <div class="grid-text"><h3>Our Story</h3><p>在此輸入內容...</p></div>
        </div>
    </section>

    <section class="info-section">
        <h2 style="font-family:'Cormorant Garamond',serif; color:#c9a466;">Wedding Info</h2>
        <div class="info-card">
            <p>2026年6月20日 (六)</p>
            <p style="margin-top:10px;">暖居日穀 (台中市北屯區松竹路一段3號)</p>
            <div class="map-container">
                <!-- 💎 更新後的地圖：使用 q 參數動態搜尋定位，確保出現紅色地標圖釘 -->
                <iframe src="https://maps.google.com/maps?q=%E6%9A%96%E5%B1%85%E6%97%A5%E7%A9%80%20%E5%8F%B0%E4%B8%AD%E5%B8%82%E5%8C%97%E5%B1%AF%E5%8D%80%E6%9D%BE%E7%AB%B9%E8%B7%AF%E4%B8%80%E6%AE%B53%E8%99%9F&t=&z=16&ie=UTF8&iwloc=&output=embed" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
            </div>
            <a href="https://maps.app.goo.gl/9ZpYxX9H2T2rB7vF8" target="_blank" style="display:inline-block; padding:10px 20px; border:1px solid #c9a466; color:#c9a466; text-decoration:none; font-size: 0.9rem;">開啟地圖導航</a>
        </div>
    </section>

    <footer style="text-align:center; padding:50px 0; color:#c9a466; font-family:'Cormorant Garamond',serif; font-style:italic;">See You Soon</footer>
</div>

<div id="player" style="position:fixed; top:-9999px;"></div>
<button id="musicToggle">▶</button>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
let droppedCount = 0;
var player;

// 檢查圖片是否載入成功 (調試用)
function checkImages() {
    console.log("頁面已載入，等待點擊照片...");
}

function dropPhoto(el) {
    if (el.classList.contains('dropped')) return;
    
    // 💎 強制：手機端必須在第一次點擊時啟動音訊上下文
    if (droppedCount === 0 && player && typeof player.playVideo === 'function') {
        player.playVideo();
    }
    
    el.classList.add('dropped');
    droppedCount++;
    
    if (droppedCount === 3) {
        setTimeout(() => {
            const overlay = document.getElementById('intro-overlay');
            const wrapper = document.getElementById('main-wrapper');
            overlay.style.opacity = '0';
            wrapper.classList.add('is-visible');
            document.body.style.overflow = 'auto';
            setTimeout(() => { overlay.style.display = 'none'; }, 1500); 
        }, 800);
    }
}

function onYouTubeIframeAPIReady() {
  player = new YT.Player('player', {
    videoId: 'pmrCXt4lNyA',
    playerVars: { 
        'autoplay': 1, 
        'loop': 1, 
        'playlist': 'pmrCXt4lNyA', 
        'controls': 0,
        'playsinline': 1, // 💎 關鍵：手機內聯播放
        'mute': 0 
    },
    events: {
      'onReady': (e) => { e.target.setVolume(30); },
      'onStateChange': (e) => {
          document.getElementById('musicToggle').innerHTML = (e.data == 1) ? '||' : '▶';
      }
    }
  });
}

document.getElementById('musicToggle').onclick = function() {
  if (player && typeof player.getPlayerState === 'function') {
    player.getPlayerState() == 1 ? player.pauseVideo() : player.playVideo();
  }
};

// 阻止手機瀏覽器預設滑動行為
document.getElementById('intro-overlay').addEventListener('touchmove', function(e) {
    e.preventDefault();
}, { passive: false });
</script>
</body>
</html>
