<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jay & Michelle Wedding</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Noto+Serif+TC:wght@200;300;400&family=Gwendolyn:wght@400;700&display=swap" rel="stylesheet">
<style>
/* 核心樣式 */
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Serif TC',serif;background:#faf8f5;color:#2c2c2c; overflow: hidden;} 

/* --- 照片開場：保持流暢優雅 --- */
#intro-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
    background: #e8dcc4; z-index: 10000;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 1.8s ease;
}
.photo-stack { position: relative; width: 300px; height: 400px; cursor: pointer; }
.photo {
    position: absolute; left: 50%; width: 280px; height: 380px;
    background: #fff; border: 12px solid #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    /* 將 william-change 優化保留，維持優雅飄落 */
    transition: transform 2.8s cubic-bezier(0.25, 0.1, 0.25, 1), opacity 1.2s ease-out; 
    will-change: transform;
    background-size: cover; background-position: center;
}
.photo:nth-child(1) { transform: translateX(-50%) rotate(-4deg); z-index: 3; }
.photo:nth-child(2) { transform: translateX(-50%) rotate(2deg); z-index: 2; }
.photo:nth-child(3) { transform: translateX(-50%) rotate(-1deg); z-index: 1; }
.photo.dropped { transform: translateY(130vh) translateX(40px) rotate(35deg) !important; opacity: 0; }

/* --- 💎 主視覺：💎 強化綢緞立體感背景 --- */
#main-wrapper { opacity: 0; transition: opacity 2s ease; }
.cover{
    height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    /* 💎 核心優化：更強烈的融合模式，提升綢緞感 */
    background-image: 
        linear-gradient(135deg,#f5f5dc,#e8dcc4), /* 保留原本米色漸層 */
        url('https://drive.google.com/uc?export=view&id=1bodtrUku_sCWA136H5rhLcKbq5oR21vT'); /* 💎 核心：這是一個穩定的綢緞紋理直連網址 */
    background-blend-mode: multiply; /* 💎 核心：將模式改為正片疊底，讓黑色絲綢的波浪陰影更強烈，提升立體感 */
    background-size: cover; 
    background-position: center;
}

.name-container { display: flex; flex-direction: column; align-items: center; position: relative; }

/* 英文層：調低 z-index */
.english-names {
    display: flex; align-items: center;
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(3rem, 10vw, 5.5rem);
    font-weight: 300;
    position: relative;
    z-index: 1; 
}
.english-names .amp {
    font-family: 'Gwendolyn', cursive;
    font-size: 8rem; color: #c9a96e; margin: 0 15px; 
    line-height: 0; position: relative; top: 10px;
}

/* 中文層：調高 z-index 並增加間距 */
.chinese-names {
    display: flex; justify-content: space-between;
    width: 100%; padding: 0 5%; 
    margin-top: 10px;
    font-family: 'Noto Serif TC', serif; font-weight: 200; font-size: 1.2rem;
    letter-spacing: 0.5em; color: #4a4a4a;
    position: relative;
    z-index: 2; 
}

.cover p { margin-top: 35px; letter-spacing: 0.3em; color: #888; }

/* 其他區塊保持穩定 */
section{padding: 80px 24px; max-width: 700px; margin: 0 auto; text-align: center;}
h2{font-family:'Cormorant Garamond',serif; font-size: 2rem; font-weight: 300; color: #c9a96e; margin-bottom: 20px;}
.info{background: #fff; padding: 30px; margin: 20px 0; border: 1px solid #e0d9d0;}
.map-container { width: 100%; height: 350px; margin: 20px 0; border: 1px solid #e0d9d0;
