<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Jay & Michelle</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Gwendolyn:wght@400;700&family=Noto+Serif+TC:wght@200;300;400;500;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
@font-face {
    font-family: 'my font';
    src: url('my%20font.ttf') format('truetype'); 
    font-display: swap; 
}
*{margin:0;padding:0;box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
html, body { width: 100%; min-height: 100%; background: #faf8f5;}
body { font-family: 'my font', 'Noto Serif TC', serif; color: #2c2c2c; overflow-x: hidden; }

/* --- 開場：Polaroid 列印動畫 --- */
#intro-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #e8dcc4;
    z-index: 10000;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 1.5s ease-in-out;
    touch-action: none;
    cursor: pointer;
}

/* 相機與照片的總容器 */
.polaroid-wrapper {
    position: relative;
    width: min(340px, 80vw);
}

/* 相機圖片（在最上層） */
.camera-img {
    display: block;
    width: 100%;
    height: auto;
    position: relative;
    z-index: 10;
    pointer-events: none;
}

/* 照片容器（在相機下層） */
.print-photo-container {
    position: absolute;
    /* 調整照片的寬度與左右位置 */
    left: 17%;
    right: 17%;
    /* 對準相機的黑色出片口 */
    top: 68%; 
    z-index: 1;
    /* 裁切掉出片口「上方」的照片，讓它看起來是從機器裡面滑出來的 */
    clip-path: inset(0 -50px -200% -50px);
}

/* 照片外框 */
.print-photo {
    width: 100%;
    aspect-ratio: 3 / 4;
    background: #fff;
    border-radius: 4px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.25);
    /* 確保初始狀態完全藏在裁切線(出片口)上方 */
    transform: translateY(-90%);
    opacity: 0; 
}

/* 照片內層影像 */
.print-photo-inner {
    width: 100%;
    height: 100%;
    background-image: url('P3.jpg');
    background-size: cover;
    background-position: center;
    filter: brightness(0.1) saturate(0.1);
}

/* 點擊列印動畫 */
.print-photo.is-printing {
    opacity: 1; 
    /* 照片往下滑出，0% 代表完全吐出來 */
    animation: photoPrint 2.5s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
}
@keyframes photoPrint {
    0%   { transform: translateY(-90%); }
    100% { transform: translateY(0%); }
}

/* 沖洗變亮動畫 */
.print-photo.is-developed .print-photo-inner {
    animation: developFade 4s forwards;
}
@keyframes developFade {
    0%   { filter: brightness(0.1) saturate(0.1); }
    100% { filter: brightness(1)   saturate(1); }
}

.print-hint {
    position: absolute;
    bottom: -60px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'my font';
    font-size: 1rem;
    letter-spacing: 0.2em;
    color: #8a7448;
    white-space: nowrap;
    animation: hintBlink 1.4s infinite;
    z-index: 20;
}
@keyframes hintBlink {
    0%,100% { opacity: 1; }
    50%     { opacity: 0.4; }
}

/* --- 主視覺 --- */
#main-wrapper { opacity: 0; visibility: hidden; transition: opacity 2s ease; width: 100%; }
#main-wrapper.is-visible { opacity: 1; visibility: visible; }

.cover {
    height: 100vh; width: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; position: relative;
    overflow: hidden; background-color: #f5f5dc;
}
.cover::before {
    content: ""; position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    background-image: url('bg_silk.jpg.png');
    background-size: cover; background-position: center;
    z-index: 1;
}
.getting-married-text { 
    color:#c9a466; margin-bottom: 12px; letter-spacing: 0.4em;
    font-size: 0.9rem; z-index: 10; font-weight: 300;
    position: relative; font-family: 'my font', serif;
}
.name-container { position: relative; z-index: 10; width: 100%; }
.english-names { font-family: 'Playfair Display', serif; font-size: clamp(1.8rem, 6vw, 3.2rem); color: #2c2c2c; letter-spacing: 0.05em; }
.english-names .amp { font-family: 'Gwendolyn', cursive; font-size: clamp(3.5rem, 10vw, 5.5rem); color: #c9a466; margin: 0 8px; vertical-align: middle; }
.chinese-names { display: flex; justify-content: space-around; width: 85%; max-width: 450px; margin: 25px auto 0; font-family: 'my font'; font-size: 2.2rem; letter-spacing: 0.2em; color: #4a4a4a; }

/* 倒數月曆 */
.countdown-section {
    padding: 70px 20px 50px;
    background: #fbf9f7;
    text-align: center;
}
.countdown-title {
    font-family: 'my font';
    color: #c9a466;
    letter-spacing: 0.3em;
    font-size: 2.2rem;
    font-weight: 700;
    margin-bottom: 10px;
}
.countdown-grid {
    max-width: 640px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    border: 1px solid #e0d9d0;
    box-shadow: 0 12px 28px rgba(0,0,0,0.08);
    padding: 28px 24px 24px;
}
.countdown-header {
    display: flex;
    justify-content: center;
    align-items: baseline;
    margin-bottom: 18px;
    font-family: 'my font';
    color: #c9a466;
}
.countdown-month {
    letter-spacing: 0.35em;
    font-size: 2.2rem;
    font-weight: 600;
}
.countdown-days-row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
    margin-bottom: 10px;
}
.countdown-day-label,
.countdown-day-ce
