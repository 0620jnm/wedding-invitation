<title>Jay & Michelle</title>

<style>
@font-face {
    font-family: 'my font';
    src: url('my%20font.ttf') format('truetype'); 
    font-display: swap; 
}

/* 載入辰宇落雁體 (沉魚落雁體) */
@font-face {
    font-family: 'ChenYuluoyan';
    src: url('https://cdn.jsdelivr.net/gh/Chenyu-otf/chenyuluoyan_thin@main/ChenYuluoyan-Thin.ttf') format('truetype');
    font-display: swap;
}

*{margin:0;padding:0;box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
html, body { width: 100%; min-height: 100%; background: #faf8f5; overflow: hidden; }
body { font-family: 'my font', 'Noto Serif TC', serif; color: #2c2c2c; overflow-x: hidden; }

/* --- 開場：Polaroid 列印動畫 --- */
#intro-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #e8dcc4;
    z-index: 10000;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 1.5s ease-in-out;
    touch-action: none;
    cursor: pointer;
}

/* 閃光燈特效 */
#flash-effect {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: #fff;
    z-index: 20000;
    opacity: 0;
    pointer-events: none; 
}
#flash-effect.is-flashing {
    animation: flashBang 0.8s ease-out forwards;
}
@keyframes flashBang {
    0%   { opacity: 0; }
    10%  { opacity: 1; }
    100% { opacity: 0; }
}

/* ★ 白色轉場層：只負責淡出淡入，不再顯示文字 ★ */
#transition-overlay {
    position: fixed; inset: 0;
    background: #fff;
    z-index: 15000;
    opacity: 0; visibility: hidden;
    transition: opacity 2.2s ease, visibility 2.2s ease;
    pointer-events: none;
}
#transition-overlay.is-visible {
    opacity: 1; visibility: visible;
}

/* ★ 整個場景容器（負責鏡頭平移） ★ */
#scene-container {
    position: relative;
    transform: translateY(0);
    /* 鏡位平移的動畫時間與曲線 */
    transition: transform 3.5s cubic-bezier(0.25, 0.8, 0.25, 1);
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
}

/* 鏡頭往下轉移的幅度 */
#scene-container.is-panning {
    transform: translateY(-70vh); 
}

/* 相機與第一張照片（P3）的主體 wrapper */
.polaroid-wrapper {
    position: relative;
    width: min(340px, 80vw);
    transition: transform 3.5s cubic-bezier(0.25, 0.8, 0.25, 1);
    z-index: 10;
}

.camera-img {
    display: block;
    width: 100%;
    height: auto;
    position: relative;
    z-index: 10;
    pointer-events: none;
    transition: opacity 3.5s ease;
}

/* 兩張照片共通的「拍立得白色邊框」設定 */
.photo-frame {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 5;
    background: #fdfdfd;
    box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    /* 拍立得邊框比例：上方與左右留窄邊，下方留大面積空白 (22%) */
    padding: 6% 6% 22% 6%; 
}

/* P3 第一張照片（動態印出）的容器 */
.print-photo-container {
    position: absolute;
    width: 47%;
    left: 26.5%;
    top: 68.3%; 
    z-index: 20;
    clip-path: inset(0 -50px -200% -50px);
    transform-origin: top center;
    transition: transform 3.5s cubic-bezier(0.25, 0.8, 0.25, 1);
    will-change: transform;
}

/* 3D 翻轉相關設定 */
.print-photo {
    transform: translateY(-95%);
    opacity: 0; 
    perspective: 1400px;
    overflow: visible;
}

.print-photo-card {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
    transition: transform 0.75s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.print-photo-card.is-flipped {
    transform: rotateY(180deg);
}

.photo-face {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    overflow: hidden;
}

.photo-front {
    background: transparent;
}

.photo-front-image {
    width: 100%;
    height: 100%;
    background-image: url('P3.jpg'); 
    background-size: cover;
    background-position: center;
    filter: brightness(0.1) saturate(0.1);
    box-shadow: inset 0 0 5px rgba(0,0,0,0.1);
}

/* 照片背面設計 */
.photo-back {
    background: #fcfcfc;
    transform: rotateY(180deg);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.04);
    border: 1px solid rgba(0,0,0,0.05);
}

.back-message {
    font-family: 'ChenYuluoyan', 'my font', cursive;
    font-size: clamp(1.5rem, 5vw, 2.5rem);
    color: #111;
    letter-spacing: 0.12em;
    text-align: center;
    line-height: 1.4;
    padding: 0 12px;
}

/* 印出動畫 */
.print-photo.is-printing {
    opacity: 1; 
    animation: photoPrint 2.5s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
}
@keyframes photoPrint {
    0%   { transform: translateY(-95%); }
    100% { transform: translateY(0%); }
}

.print-photo.is-developed .photo-front-image {
    animation: developFade 4s forwards;
}
@keyframes developFade {
    0%   { filter: brightness(0.1) saturate(0.1); }
    100% { filter: brightness(1)   saturate(1); }
}

/* 運鏡特效：相機上抽與淡出，P3 稍微往左下擺 */
.polaroid-wrapper.is-focusing {
    transform: translateY(-20vh);
}

.polaroid-wrapper.is-focusing .camera-img {
    opacity: 0;
}

.polaroid-wrapper.is-focusing .print-photo-container {
    transform: translate(-55%, 60vh) rotate(-6deg);
}

/* P3 翻面後變成橫式 */
.print-photo-container.fast-flip {
    transition: transform 0.9s cubic-bezier(0.2, 0.85, 0.2, 1);
}

.polaroid-wrapper.is-focusing .print-photo-container.is-back-landscape {
    transform: translate(-28%, 57vh) rotate(90deg) scale(0.94);
    z-index: 45;
}

/* 手伸進來翻照片 */
.hand-swipe {
    position: absolute;
    width: min(180px, 38vw);
    height: min(88px, 18vw);
    right: -32%;
    top: 154%;
    z-index: 60;
    opacity: 0;
    transform: translateX(180px) rotate(-10deg);
    pointer-events: none;
    filter: drop-shadow(0 10px 18px rgba(0,0,0,0.18));
}
.hand-swipe::before {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(135deg, #f6d2b8 0%, #efc3a4 100%);
    border-radius: 46px 28px 28px 42px;
    box-shadow: inset -10px -8px 0 rgba(197, 138, 102, 0.18);
}
.hand-swipe::after {
    content: ""; position: absolute; width: 42px; height: 64px; left: 16px; top: 38px;
    background: linear-gradient(135deg, #f6d2b8 0%, #efc3a4 100%);
    border-radius: 26px; transform: rotate(42deg);
    box-shadow: inset -6px -6px 0 rgba(197, 138, 102, 0.16);
}
.hand-swipe.is-active {
    animation: handGrab 1.15s cubic-bezier(0.2, 0.85, 0.2, 1) forwards;
}
@keyframes handGrab {
    0%   { opacity: 0; transform: translateX(180px) rotate(-10deg); }
    12%  { opacity: 1; }
    48%  { opacity: 1; transform: translateX(8px) translateY(-4px) rotate(-6deg); }
    72%  { opacity: 1; transform: translateX(-34px) translateY(-8px) rotate(-2deg); }
    100% { opacity: 0; transform: translateX(150px) translateY(-10px) rotate(5deg); }
}

/* ★ P2 第二張照片（一開始藏在下方，不透明）的容器 ★ */
.static-photo-container {
    position: absolute; width: 45%;
    left: 52%; top: 220%; z-index: 5; 
    transform: rotate(8deg); opacity: 1; 
}
.static-photo-inner {
    width: 100%; height: 100%;
    background-image: url('P2.png'); background-size: cover; background-position: center;
    box-shadow: inset 0 0 5px rgba(0,0,0,0.1);
}
.photo-date {
    position: absolute; bottom: 11%; left: 50%;
    transform: translate(-50%, 50%); width: 100%;
    text-align: center; font-family: 'Nanum Pen Script', cursive;
    font-size: clamp(1.2rem, 4.5vw, 1.8rem); color: #3b3b3b; 
    opacity: 0.85; letter-spacing: 0.1em; pointer-events: none; z-index: 2;
}

/* 點擊文字提示 */
.print-hint {
    position: absolute; bottom: -80px; left: 50%; transform: translateX(-50%);
    font-family: 'my font'; font-size: 1.5rem; letter-spacing: 0.2em; color: #8a7448;
    white-space: nowrap; opacity: 0; transition: opacity 0.3s ease; z-index: 30;
}
