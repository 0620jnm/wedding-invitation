/* 基礎修正 */
*{margin:0;padding:0;box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
html, body { width: 100%; height: 100%; height: -webkit-fill-available; overflow-x: hidden; background: #faf8f5;}
body{font-family:'Noto Serif TC',serif; color:#2c2c2c; position: relative;} 

/* --- 開場：拍立得 --- */
#intro-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #e8dcc4; z-index: 10000;
    display: flex; align-items: center; justify-content: center; transition: opacity 1.5s ease-in-out; touch-action: none; 
}
.camera-container { position: relative; width: 280px; height: 340px; background-image: url('camera.png'); background-size: contain; background-position: center; background-repeat: no-repeat; z-index: 10001; }
.photo-stack { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); width: 220px; height: 260px; z-index: 10000; }
.photo {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: #fff; border: 6px solid #fff; border-bottom: 25px solid #fff;
    box-shadow: 0 5px 15px rgba(0,0,0,0.15); transition: transform 1.2s cubic-bezier(0.22, 1, 0.36, 1), opacity 1s ease-out, filter 1s ease-out; 
    background-size: cover; background-position: center; opacity: 0; cursor: pointer;
}
.photo::after {
    content: ""; position: absolute; top: -10px; left: -15px; width: 90px; height: 25px;
    background-color: rgba(224, 203, 160, 0.85); transform: rotate(-12deg);
    box-shadow: 1px 2px 4px rgba(0,0,0,0.08); z-index: 10;
    clip-path: polygon( 2% 5%, 8% 0%, 92% 5%, 98% 0%, 100% 50%, 97% 95%, 90% 100%, 10% 95%, 0% 100%, 3% 50% );
    background-image: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0) 100%);
}
.photo:nth-child(1) { animation: printOut 1.2s forwards 0.3s; z-index: 1; --rot: 0deg; --slide: 0px; }
@keyframes printOut { from { opacity: 0; transform: translateY(-50px) rotate(0deg); } to { opacity: 1; transform: translateY(var(--slide)) rotate(var(--rot)); } }
.photo.dropped { transform: translateY(80px) scale(1.05) rotate(5deg) !important; opacity: 0 !important; filter: blur(15px) !important; pointer-events: none; }

/* --- 主視覺 --- */
#main-wrapper { opacity: 0; visibility: hidden; transition: opacity 2s ease; }
#main-wrapper.is-visible { opacity: 1; visibility: visible; }
.cover { height: 100vh; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; position: relative; overflow: hidden; background-color: #f5f5dc; }
.cover::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url('bg_silk.jpg.png'); background-size: cover; background-position: center; z-index: 1; }
.getting-married-text { color:#c9a466; margin-bottom:12px; letter-spacing:0.4em; font-size: 0.85rem; z-index: 10; position: relative;}
.name-container { position: relative; z-index: 10; width: 100%; }
.english-names { font-family: 'Playfair Display', serif; font-size: clamp(2.2rem, 7vw, 4rem); font-weight: 300; }
.english-names .amp { font-family: 'Gwendolyn', cursive; font-size: clamp(3.5rem, 10vw, 5.5rem); color: #c9a466; margin: 0 8px; vertical-align: middle; }
.chinese-names { display: flex; justify-content: space-around; width: 85%; max-width: 450px; margin: 25px auto 0; font-family: 'Noto Serif TC', serif; font-size: 2rem; letter-spacing: 0.2em; color: #4a4a4a; }

/* 內容區 */
.content-section { padding: 50px 20px; max-width: 1000px; margin: 0 auto; }
.grid-row { display: flex; flex-direction: column; gap: 30px; margin-bottom: 60px; }
.grid-images { display: flex; gap: 10px; width: 100%; }
.grid-img { flex: 1; height: 250px; background-size: cover; background-position: center; border: 5px solid #fff; box-shadow: 0 3px 10px rgba(0,0,0,0.05); }
.grid-text h3 { font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; color: #c9a466; margin-bottom: 10px; }

/* 婚禮資訊與月曆倒數設計 */
.info-section { padding: 60px 20px; background: #fbf9f7; text-align: center; }
.info-card { background: #fff; padding: 40px 20px; margin: 20px auto; border: 1px solid #e0d9d0; position: relative; overflow: hidden;}
.info-card::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url('P3.jpg'); background-size: cover; background-position: center; opacity: 0.15; z-index: 0; }
.info-content { position: relative; z-index: 1; }

.wedding-datetime { font-size: 1.25rem; color: #4a4a4a; line-height: 1.8; font-weight: 500; font-family: 'Noto Serif TC', serif; letter-spacing: 0.1em; margin-bottom: 25px; }

/* 倒數計時器 */
.countdown-container { display: flex; justify-content: center; gap: 10px; margin-bottom: 35px; }
.countdown-box { background: #1a1a1a; color: #fff; padding: 12px 15px; border-radius: 8px; min-width: 65px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
.cd-num { font-size: 1.8rem; font-family: 'Playfair Display', serif; font-weight: 500; line-height: 1; margin-bottom: 5px; }
.cd-label { font-size: 0.8rem; font-family: 'Noto Serif TC', serif; opacity: 0.8; }

/* 💎 半透明月曆區塊 */

    border-radius: 20px;
    padding: 30px 15px 25px 15px;
    max-width: 320px;
    margin: 0 auto 30px auto;
    box-shadow: 0 10px 30px rgba(0,0,0,0.05);
