<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Jay & Michelle Wedding</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Noto+Serif+TC:wght@200;300;400;500;700&family=Gwendolyn:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* 💎 1. 字體與基礎設定 */
@font-face {
    font-family: 'my font';
    src: url('my%20font.ttf') format('truetype'); 
    font-display: swap; 
}

*{margin:0;padding:0;box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
html, body { width: 100%; height: 100vh; height: -webkit-fill-available; overflow-x: hidden; background: #faf8f5;}
body { font-family: 'my font', 'Noto Serif TC', serif; color: #2c2c2c; } 

/* --- 💎 開場：拍立得強制置中 --- */
#intro-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
    background: #e8dcc4; z-index: 10000;
    /* 💎 強制：使用 Flexbox 讓內容永遠置中 */
    display: flex; align-items: center; justify-content: center;
    transition: opacity 2s ease-in-out; 
    touch-action: none; /* 防止滑動擋住點擊 */
}
.camera-container {
    position: relative; width: 320px; height: 380px;
    background-image: url('camera.png'); background-size: contain; background-position: center; background-repeat: no-repeat;
    cursor: pointer; z-index: 10001;
}
.photo-stack { position: absolute; top: 50px; left: 50%; transform: translateX(-50%); width: 250px; height: 300px; z-index: 10000; }
.photo {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    background: #fff; border: 8px solid #fff; border-bottom: 30px solid #fff;
    box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    transition: transform 1.5s cubic-bezier(0.22, 1, 0.36, 1), opacity 1s ease-out, filter 1s ease-out; 
    background-size: cover; background-position: center; opacity: 0;
    background-image: url('P3.jpg'); 
}
.photo:nth-child(1) { animation: printOut 1.5s forwards 0.3s; z-index: 3; --rot: -5deg; --slide: 30px; }
.photo:nth-child(2) { animation: printOut 1.5s forwards 0.6s; z-index: 2; --rot: 3deg; --slide: 15px; }
.photo:nth-child(3) { animation: printOut 1.5s forwards 0.9s; z-index: 1; --rot: 0deg; --slide: 0px; }

@keyframes printOut { 
    from { opacity: 0; transform: translateY(-80px) rotate(0deg); } 
    to { opacity: 1; transform: translateY(var(--slide)) rotate(var(--rot)); } 
}

/* 💎 修正點擊後掉落動畫：移除特定位移，改用 scale 模糊淡出 */
.photo.dropped { 
    transform: scale(1.15) translateY(-20px) !important; /* 保留典雅的輕微放大 */
    opacity: 0 !important; 
    filter: blur(15px); /* 模糊讓淡出更柔和 */
    pointer-events: none; 
}

/* --- 主視覺：優雅淡入 --- */
#main-wrapper { 
    opacity: 0; 
    transition: opacity 3s ease; 
}
#main-wrapper.is-visible {
    opacity: 1;
}

.cover { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; position: relative; overflow: hidden; background-color: #f5f5dc; }
.cover::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url('bg_silk.jpg.png'); background-size: cover; background-position: center; z-index: 1; }

.getting-married-text { color:#c9a466; margin-bottom:12px; letter-spacing:0.4em; font-size: 0.9rem; z-index: 10; font-weight: 300; font-family: 'my font', serif;}

.name-container { position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; }
.english-names { font-family: 'Playfair Display', serif; font-size: clamp(1.8rem, 6vw, 3.2rem); color: #2c2c2c; letter-spacing: 0.05em; }
.english-names .amp { font-family: 'Gwendolyn', cursive; font-size: clamp(3.5rem, 10vw, 5.5rem); color: #c9a466; margin: 0 8px; vertical-align: middle; }

/* 💎 中文姓名：套用您的 my font.ttf */
.chinese-names { 
    display: flex; justify-content: space-between; 
    width: 100%; padding: 0 10%; margin-top: 25px; 
    font-family: 'my font', serif; font-size: 2.2rem; letter-spacing: 0.2em; color: #4a4a4a; 
}

/* 婚禮資訊 & 倒數 */
.info-section { padding: 60px 20px; background: #fbf9f7; text-align: center; }
.countdown-container { display: flex; justify-content: center; gap: 12px; margin: 25px 0; }
.countdown-box { background: #c9a466; color: #fff; width: 65px; height: 80px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.countdown-number { font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: bold; }
.calendar-wrapper { max-width: 320px; margin: 0 auto 30px auto; padding: 25px; background: rgba(255, 255, 255, 0.8); border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
.calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px 0; font-family: 'Playfair Display', serif; }
.highlight { background-color: #a82424; color: white; border-radius: 50%; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; margin: 0 auto; box-shadow: 0 4px 10px rgba(168,36,36,0.3); }

/* 表單樣式 */
.form-card { max-width: 500px; background: #fff; padding: 30px; margin: 0 auto; border: 1px solid #e0d9d0; box-shadow: 0 5px 15px rgba(0,0,0,0.03); }
.submit-btn { width: 100%; padding: 15px; background: #c9a466; color: #fff; border: none; cursor: pointer; font-family: 'my font', serif; font-size: 1.2rem; }

/* 💎 留言祝福區牆 (Firebase 連動版) */
.sticky-wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; padding: 20px; max-width: 900px; margin: 0 auto; }
.sticky-note { 
    padding: 18px; box-shadow: 2px 3px 10px rgba(0,0,0,0.1); 
    font-family: 'my font', serif; text-align: left; 
    transition: transform 0.3s; position: relative; 
    /* 預設旋轉與位移 (左右交錯邏輯在 JS 中) */
    transform: rotate(var(--note-rot)) translate(var(--note-x), var(--note-y));
}
/* 💎 圖釘樣式 */
.sticky-note::before {
    content: ""; position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
    width: 24px; height: 24px; background-color: #a82424; border-radius: 50%;
    box-shadow: 1px 2px 4px rgba(0,0,0,0.2), inset -2px -2px 4px rgba(0,0,0,0.3); z-index: 2;
}
.sticky-note::after {
    content: ""; position: absolute; top: -5px; left: 50%; transform: translateX(-50%);
    width: 4px; height: 14px; background: #ccc; z-index: 1;
}
/* 指定五色系 */
.sticky-note:nth-child(5n+1) { background-color: #C9A466; }
.sticky-note
