<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jay & Michelle Wedding</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Noto+Serif+TC:wght@200;300;400&family=Gwendolyn:wght@400;700&family=Playfair+Display:ital,wght@0,400;1,400&family=Zen+Old+Mincho:wght@400;500&display=swap" rel="stylesheet">
<style>
/* 基礎設定 */
*{margin:0;padding:0;box-sizing:border-box}
html, body { width: 100%; overflow-x: hidden; background: #faf8f5; -webkit-text-size-adjust: 100%;}
body{font-family:'Noto Serif TC',serif; color:#2c2c2c;} 

/* --- 💎 開場：拍立得 (影像淡出版) --- */
#intro-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
    background: #e8dcc4; z-index: 10000;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 1.5s ease-in-out; 
}
.camera-container {
    position: relative; width: 320px; height: 380px;
    background-image: url('camera.png'); background-size: contain; background-position: center; background-repeat: no-repeat;
    z-index: 10001;
}
.photo-stack { position: absolute; top: 50px; left: 50%; transform: translateX(-50%); width: 250px; height: 300px; z-index: 10000; }
.photo {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    background: #fff; border: 8px solid #fff; border-bottom: 30px solid #fff;
    box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    transition: transform 1.2s cubic-bezier(0.22, 1, 0.36, 1), opacity 1.5s ease-out; 
    background-size: cover; background-position: center; opacity: 0;
}

.photo:nth-child(1) { animation: printOut 1.5s forwards 0.3s; z-index: 3; --rot: -5deg; --slide: 30px; }
.photo:nth-child(2) { animation: printOut 1.5s forwards 0.6s; z-index: 2; --rot: 3deg; --slide: 15px; }
.photo:nth-child(3) { animation: printOut 1.5s forwards 0.9s; z-index: 1; --rot: 0deg; --slide: 0px; }

@keyframes printOut { 
    from { opacity: 0; transform: translateY(-80px) rotate(0deg); } 
    to { opacity: 1; transform: translateY(var(--slide)) rotate(var(--rot)); } 
}

/* 💎 點擊後的「影像慢慢淡出」特效 */
.photo.dropped { 
    transform: translateY(50px) scale(0.9) !important; 
    opacity: 0 !important; 
    pointer-events: none; 
}

/* --- 💎 主視覺 --- */
#main-wrapper { opacity: 0; visibility: hidden; transition: opacity 3s ease; }
#main-wrapper.is-visible { opacity: 1; visibility: visible; }

.cover {
    height: 100vh; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    position: relative; overflow: hidden; background-color: #f5f5dc; 
}
.cover::before {
    content: ""; position: absolute; top: -5%; left: -5%; width: 110%; height: 110%;
    background-image: url('bg_silk.jpg.png'); background-size: cover; background-position: center;
    animation: silkFloat 30s infinite alternate ease-in-out; z-index: 1;
}
@keyframes silkFloat { 0% { transform: scale(1); } 100% { transform: scale(1.05); } }

.getting-married-text { color:#c9a466; margin-bottom:12px; letter-spacing:0.4em; font-size: 0.9rem; z-index: 10; }

.name-container { position: relative; z-index: 10; width: 100%; }
.english-names { font-family: 'Playfair Display', serif; font-size: clamp(2.5rem, 8vw, 4.5rem); font-weight: 300; }
.english-names .amp { font-family: 'Gwendolyn', cursive; font-size: clamp(4rem, 12vw, 6rem); color: #c9a466; margin: 0 10px; vertical-align: middle; }

.chinese-names { 
    display: flex; justify-content: space-around; width: 80%; max-width: 500px; margin: 30px auto 0; 
    font-family: 'Zen Old Mincho', serif; font-size: 2.2rem; letter-spacing: 0.3em; color: #4a4a4a; 
}

/* --- 內容區 --- */
.content-section { padding: 60px 20px; max-width: 1000px; margin: 0 auto; }
.grid-row { display: flex; flex-wrap: wrap; gap: 40px; align-items: center; margin-bottom: 80px; }
.grid-row.reverse { flex-direction: row-reverse; }
.grid-images { flex: 1.2; display: flex; gap: 10px; min-width: 320px; }
.grid-img { flex: 1; height: 300px; background-size: cover; background-position: center; border: 8px solid #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
.grid-text { flex: 1; min-width: 300px; }
.grid-text h3 { font-family: 'Cormorant Garamond', serif; font-size: 2rem; color: #c9a466; margin-bottom: 15px; }

.info-section { padding: 80px 20px; background: #fbf9f7; text-align: center; }
.info-card { background: #fff; padding: 40px; max-width: 700px; margin: 20px auto; border: 1px solid #e0d9d0; }
.map-container { width: 100%; height: 350px; margin: 25px 0; border: 1px solid #e0d9d0; }

#musicToggle { position: fixed; bottom: 20px; right: 20px; width: 45px; height: 45px; border-radius: 50%; background: #c9a466; border: none; color: white; cursor: pointer; z-index: 9999; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>

<div id="intro-overlay">
    <div class="camera-container">
        <div class="photo-stack">
            <div class="photo" onclick="dropPhoto(this)" style="background-image: url('p1.jpg');"></div>
            <div class="photo" onclick="dropPhoto(this)" style="background-image: url('p2.jpg');"></div>
            <div class="photo" onclick="dropPhoto(this)" style="background-image: url('p3.jpg');"></div>
        </div>
    </div>
</div>

<div id="main-wrapper">
    <div class="cover">
        <p class="getting-married-text">WE'RE GETTING MARRIED</p>
        <div class="name-container">
            <div class="english-names">Jay <span class="amp">&</span> Michelle</div>
            <div class="chinese-names"><span>蔡宇杰</span><span>陳旻瑄</span></div>
        </div>
        <p style="margin-top:25px; color:#888; letter-spacing:0.2em;">2026·06·20</p>
    </div>

    <section class="content-section">
        <div class="grid-row">
            <div class="grid-images"><div class="grid-img" style="background-image: url('story1a.jpg');"></div><div class="grid-img" style="background-image: url('story1b.jpg');"></div></div>
            <div class="grid-text"><h3>Our Story</h3><p>在此輸入內容...</p></div>
        </div>
    </section>

    <section class="info-section">
        <h2 style="font-family:'Cormorant Garamond',serif; color:#c9a466; font-size:2.5rem;">Wedding Info</h2>
        <div class="info-card">
            <h3>日期時間</h3>
            <p style="font-size:1.2rem; margin-top:10px;">2026年6月20日 (六)</p>
        </div>
        <div class="info-card">
            <h3>地點與地圖</h3>
            <p>暖居日穀 (台中市北屯區松竹路一段3號)</p>
            <div class="map-container">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3640.1234!2d120.7061732!3d24.1695421!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x346917e765509935%3A0xc3199182372d887a!2z5pqW5bGF5pel56穀!5e0!3m2!1szh-TW!2stw!4v1710000000000" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
            </div>
            <a href="https://maps.app.goo.gl/uXpDaq89oUu3X8L37" target="_blank" style="display:inline-block; padding:12px 25px; border:1px solid #c9a466; color:#c9a466; text-decoration:none;">開啟 Google 地圖導航</a>
        </div>
    </section>

    <footer style="text-align:center; padding:80px 0; color:#c9a466; font-family:'Cormorant Garamond',serif; font-size:1.5rem; font-style:italic;">See You Soon</footer>
</div>

<div id="player" style="position:fixed; top:-9999px;"></div>
<button id="musicToggle">▶</button>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
let droppedCount = 0;
var player;

function dropPhoto(el) {
    if (el.classList.contains('dropped')) return;
    
    // 💎 手機端修正：必須由使用者點擊動作觸發音樂
    if (droppedCount === 0 && player) {
        try { player.playVideo(); } catch(e) {}
    }
    
    el.classList.add('dropped');
    droppedCount++;
    
    if (droppedCount === 3) {
        setTimeout(() => {
            document.getElementById('intro-overlay').style.opacity = '0';
            document.getElementById('main-wrapper').classList.add('is-visible');
            setTimeout(() => {
                document.body.style.overflow = 'auto';
                document.getElementById('intro-overlay').style.display = 'none';
            }, 1500); 
        }, 800);
    }
}

function onYouTubeIframeAPIReady() {
  player = new YT.Player('player', {
    videoId: 'pmrCXt4lNyA',
    playerVars: { 
        'autoplay': 1, 
        'loop': 1, 
        'playlist': 'pmrCXt4lNyA', 
        'controls': 0,
        'playsinline': 1 // 💎 關鍵：讓影片在手機網頁內播放，而不跳出 App
    },
    events: {
      'onReady': (e) => { e.target.setVolume(30); },
      'onStateChange': (e) => {
          document.getElementById('musicToggle').innerHTML = (e.data == 1) ? '||' : '▶';
      }
    }
  });
}

document.getElementById('musicToggle').onclick = function() {
  if (player && typeof player.getPlayerState === 'function') {
    player.getPlayerState() == 1 ? player.pauseVideo() : player.playVideo();
  }
};
</script>
</body>
</html>
