<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Jay & Michelle</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Noto+Serif+TC:wght@200;300;400;500;700&family=Gwendolyn:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Zen+Old+Mincho:wght@400;500&display=swap" rel="stylesheet">
<style>
/* 基礎修正 */
*{margin:0;padding:0;box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
html, body { width: 100%; height: 100%; height: -webkit-fill-available; overflow-x: hidden; background: #faf8f5;}
body{font-family:'Noto Serif TC',serif; color:#2c2c2c; position: relative;} 

/* --- 開場：拍立得 --- */
#intro-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #e8dcc4; z-index: 10000;
    display: flex; align-items: center; justify-content: center; transition: opacity 1.5s ease-in-out; touch-action: none; 
}
.camera-container { position: relative; width: 280px; height: 340px; background-image: url('camera.png'); background-size: contain; background-position: center; background-repeat: no-repeat; z-index: 10001; }
.photo-stack { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); width: 220px; height: 260px; z-index: 10000; }
.photo {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: #fff; border: 6px solid #fff; border-bottom: 25px solid #fff;
    box-shadow: 0 5px 15px rgba(0,0,0,0.15); transition: transform 1.2s cubic-bezier(0.22, 1, 0.36, 1), opacity 1s ease-out, filter 1s ease-out; 
    background-size: cover; background-position: center; opacity: 0; cursor: pointer;
}
.photo::after {
    content: ""; position: absolute; top: -10px; left: -15px; width: 90px; height: 25px;
    background-color: rgba(224, 203, 160, 0.85); transform: rotate(-12deg);
    box-shadow: 1px 2px 4px rgba(0,0,0,0.08); z-index: 10;
    clip-path: polygon( 2% 5%, 8% 0%, 92% 5%, 98% 0%, 100% 50%, 97% 95%, 90% 100%, 10% 95%, 0% 100%, 3% 50% );
    background-image: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0) 100%);
}
.photo:nth-child(1) { animation: printOut 1.2s forwards 0.3s; z-index: 1; --rot: 0deg; --slide: 0px; }
@keyframes printOut { from { opacity: 0; transform: translateY(-50px) rotate(0deg); } to { opacity: 1; transform: translateY(var(--slide)) rotate(var(--rot)); } }
.photo.dropped { transform: translateY(80px) scale(1.05) rotate(5deg) !important; opacity: 0 !important; filter: blur(15px) !important; pointer-events: none; }

/* --- 主視覺 --- */
#main-wrapper { opacity: 0; visibility: hidden; transition: opacity 2s ease; }
#main-wrapper.is-visible { opacity: 1; visibility: visible; }
.cover { height: 100vh; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; position: relative; overflow: hidden; background-color: #f5f5dc; }
.cover::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url('bg_silk.jpg.png'); background-size: cover; background-position: center; z-index: 1; }
.getting-married-text { color:#c9a466; margin-bottom:12px; letter-spacing:0.4em; font-size: 0.85rem; z-index: 10; position: relative;}
.name-container { position: relative; z-index: 10; width: 100%; }
.english-names { font-family: 'Playfair Display', serif; font-size: clamp(2.2rem, 7vw, 4rem); font-weight: 300; }
.english-names .amp { font-family: 'Gwendolyn', cursive; font-size: clamp(3.5rem, 10vw, 5.5rem); color: #c9a466; margin: 0 8px; vertical-align: middle; }
.chinese-names { display: flex; justify-content: space-around; width: 85%; max-width: 450px; margin: 25px auto 0; font-family: 'Noto Serif TC', serif; font-size: 2rem; letter-spacing: 0.2em; color: #4a4a4a; }

/* 內容區 */
.content-section { padding: 50px 20px; max-width: 1000px; margin: 0 auto; }
.grid-row { display: flex; flex-direction: column; gap: 30px; margin-bottom: 60px; }
.grid-images { display: flex; gap: 10px; width: 100%; }
.grid-img { flex: 1; height: 250px; background-size: cover; background-position: center; border: 5px solid #fff; box-shadow: 0 3px 10px rgba(0,0,0,0.05); }
.grid-text h3 { font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; color: #c9a466; margin-bottom: 10px; }

/* 婚禮資訊 */
.info-section { padding: 60px 20px; background: #fbf9f7; text-align: center; }
.info-card { background: #fff; padding: 40px 20px; margin: 20px auto; border: 1px solid #e0d9d0; }
.map-container { width: 100%; height: 300px; margin: 20px 0; border: 1px solid #e0d9d0; }

/* 💎 日期一體化框線月曆樣式 */
.calendar-wrapper { max-width: 290px; margin: 0 auto 30px auto; position: relative; }
.calendar-inner-box { border: 1px solid rgba(201, 164, 102, 0.4); padding: 35px 20px 20px 20px; border-radius: 4px; position: relative; background: #fff; }

.big-date { font-family: 'Cormorant Garamond', serif; font-size: 3.8rem; color: #c9a466; letter-spacing: 0.08em; margin-bottom: 30px; line-height: 1; font-weight: 300; }
.big-date span { font-size: 2.8rem; font-weight: 200; margin: 0 5px; opacity: 0.6; }

.calendar-header { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; color: #c9a466; margin-bottom: 15px; font-size: 0.85rem; font-weight: 400; }
.calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; gap: 12px 0; font-size: 1.05rem; position: relative; z-index: 2; font-family: 'Playfair Display', serif; color: #c9a466; }
.calendar-bg-year { position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%); font-size: 6.5rem; color: rgba(201, 164, 102, 0.08); font-weight: bold; z-index: 1; pointer-events: none; font-family: 'Playfair Display', serif; letter-spacing: -0.05em; width: 100%; text-align: center;}
.cal-day { display: flex; align-items: center; justify-content: center; }
.cal-day .highlight { background-color: #c9a466; color: white; border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(201,164,102,0.4); font-weight: bold; }

.calendar-footer { margin-top: 25px; border-top: 1px solid rgba(201, 164, 102, 0.3); padding-top: 15px; font-size: 1rem; color: #c9a466; line-height: 1.8; font-weight: 400; font-family: 'Noto Serif TC', serif; letter-spacing: 0.1em; }

/* --- RSVP 與留言表單 --- */
.form-section { padding: 60px 20px; text-align: center; }
.form-card { max-width: 500px; background: #fff; padding: 40px 30px; margin: 0 auto; border: 1px solid #e0d9d0; box-shadow: 0 5px 15px rgba(0,0,0,0.03); }
.form-group { margin-bottom: 25px; text-align: left; }
.form-group label { display: block; font-size: 1rem; color: #4a4a4a; margin-bottom: 8px; font-weight: 500; }
.form-group input[type="text"], .form-group textarea { width: 100%; padding: 12px; border: 1px solid #dcdcdc; border-radius: 4px; font-family: 'Noto Serif TC', serif; font-size: 1rem; background: #faf8f5; transition: border-color 0.3s; }
.form-group textarea { resize: vertical; min-height: 100px; }
.form-group input[type="text"]:focus, .form-group textarea:focus { outline: none; border-color: #c9a466; }
.radio-group { display: flex; gap: 20px; margin-top: 10px; }
.radio-label { display: flex; align-items: center; gap: 8px; font-size: 1rem; color: #4a4a4a; cursor: pointer; }
.radio-label input[type="radio"] { accent-color: #c9a466; width: 18px; height: 18px; cursor: pointer; }
.submit-btn { width: 100%; padding: 15px; background: #c9a466; color: #fff; border: none; font-family: 'Noto Serif TC', serif; font-size: 1.1rem; letter-spacing: 0.1em; cursor: pointer; border-radius: 4px; transition: background 0.3s; margin-top: 10px; }
.submit-btn:hover { background: #b8955a; }
.guestbook-section { background: #fbf9f7; }

/* 便利貼留言牆樣式 */
.sticky-wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; padding: 30px 10px; max-width: 800px; margin: 0 auto; }
.sticky-note { padding: 20px; box-shadow: 3px 4px 10px rgba(0,0,0,0.1); position: relative; font-family: 'Noto Serif TC', serif; text-align: left; transition: transform 0.3s, box-shadow 0.3s; }
.sticky-note:nth-child(6n+1) { background-color: #fdf5c9; transform: rotate(-2deg); }
.sticky-note:nth-child(6n+2) { background-color: #fce4ec; transform: rotate(3deg); }
.sticky-note:nth-child(6n+3) { background-color: #e3f2fd; transform: rotate(-1deg); }
.sticky-note:nth-child(6n+4) { background-color: #e8f5e9; transform: rotate(2deg); }
.sticky-note:nth-child(6n+5) { background-color: #fff3e0; transform: rotate(-3deg); }
.sticky-note:nth-child(6n+6) { background-color: #f3e5f5; transform: rotate(1deg); }
.sticky-note:hover { transform: scale(1.05) !important; z-index: 5; box-shadow: 5px 6px 15px rgba(0,0,0,0.15); }
.note-text { font-size: 1rem; color: #333; line-height: 1.5; margin-bottom: 15px; word-wrap: break-word; }
.note-author { font-size: 0.9rem; color: rgba(0,0,0,0.6); text-align: right; font-weight: bold; border-top: 1px dashed rgba(0,0,0,0.15); padding-top: 8px; }

#musicToggle { position: fixed; bottom: 20px; right: 20px; width: 40px; height: 40px; border-radius: 50%; background: #c9a466; border: none; color: white; cursor: pointer; z-index: 9999; display: flex; align-items: center; justify-content: center; }
</style>
</head>

    <section class="content-section">
        <div class="grid-row">

                <div class="grid-img" style="background-image: url('story1a.jpg');"></div>

            <div class="grid-text"><h3>Our Story</h3
