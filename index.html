<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Jay & Michelle</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Noto+Serif+TC:wght@200;300;400;500;700&family=Gwendolyn:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Zen+Old+Mincho:wght@400;500&display=swap" rel="stylesheet">
<style>
/* 💎 1. 字體定義 */
@font-face {
    font-family: 'my font';
    src: url('my%20font.ttf') format('truetype'); 
    font-display: swap; 
}

/* 基礎修正 */
*{margin:0;padding:0;box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
html, body { width: 100%; height: 100%; height: -webkit-fill-available; overflow-x: hidden; background: #faf8f5;}
body { font-family: 'my font', 'Noto Serif TC', serif; color: #2c2c2c; position: relative; } 

/* --- 開場：拍立得 --- */
#intro-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #e8dcc4; z-index: 10000; display: flex; align-items: center; justify-content: center; transition: opacity 1.5s ease-in-out; touch-action: none; }
.camera-container { position: relative; width: 280px; height: 340px; background-image: url('camera.png'); background-size: contain; background-position: center; background-repeat: no-repeat; z-index: 10001; }
.photo-stack { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); width: 220px; height: 260px; z-index: 10000; }
.photo { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: #fff; border: 6px solid #fff; border-bottom: 25px solid #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.15); transition: transform 1.2s cubic-bezier(0.22, 1, 0.36, 1), opacity 1.2s ease-out, filter 1.5s ease-out; background-size: cover; background-position: center; opacity: 0; cursor: pointer; }
.photo:nth-child(1) { animation: printOut 1.2s forwards 0.3s; z-index: 1; --rot: 0deg; --slide: 0px; }
@keyframes printOut { from { opacity: 0; transform: translateY(-50px) rotate(0deg); } to { opacity: 1; transform: translateY(var(--slide)) rotate(var(--rot)); } }
.photo.dropped { transform: scale(1.1) translateY(-20px) !important; opacity: 0 !important; filter: blur(20px) !important; pointer-events: none; }

/* --- 主視覺 --- */
#main-wrapper { opacity: 0; visibility: hidden; transition: opacity 2s ease; }
#main-wrapper.is-visible { opacity: 1; visibility: visible; }
.cover { height: 100vh; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; position: relative; overflow: hidden; background-color: #f5f5dc; }
.cover::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url('bg_silk.jpg.png'); background-size: cover; background-position: center; z-index: 1; }
.chinese-names { display: flex; justify-content: space-around; width: 85%; max-width: 450px; margin: 25px auto 0; font-family: 'my font', serif; font-size: 2.5rem; letter-spacing: 0.2em; color: #4a4a4a; z-index: 10; position: relative; }
.english-names { font-family: 'Playfair Display', serif; font-size: clamp(2.2rem, 7vw, 4rem); font-weight: 300; z-index: 10; position: relative; }
.english-names .amp { font-family: 'Gwendolyn', cursive; font-size: clamp(3.5rem, 10vw, 5.5rem); color: #c9a466; margin: 0 8px; vertical-align: middle; }

/* 內容區 */
.content-section { padding: 50px 20px; max-width: 1000px; margin: 0 auto; }
.grid-row { display: flex; flex-direction: column; gap: 30px; margin-bottom: 60px; }
.grid-images { display: flex; gap: 10px; width: 100%; }
.grid-img { flex: 1; height: 250px; background-size: cover; background-position: center; border: 5px solid #fff; box-shadow: 0 3px 10px rgba(0,0,0,0.05); }

/* 婚禮資訊 & 倒數 */
.info-section { padding: 60px 20px; background: #fbf9f7; text-align: center; }
.wedding-date-header p { font-size: 1.15rem; color: #c9a466; margin-bottom: 10px; font-family: 'my font', serif; }

.countdown-container { display: flex; justify-content: center; gap: 12px; margin: 25px 0; }
.countdown-box { background: #c9a466; color: #fff; width: 65px; height: 80px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.countdown-number { font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: bold; }
.countdown-label { font-size: 0.75rem; border-top: 1px solid rgba(255,255,255,0.3); width: 80%; padding-top: 3px; margin-top: 3px; }

/* 月曆 */
.calendar-wrapper { max-width: 320px; margin: 0 auto 30px auto; position: relative; padding: 25px; background: rgba(255, 255, 255, 0.8); border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
.calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px 0; font-size: 1.1rem; font-family: 'Playfair Display', serif; }
.cal-header { display: grid; grid-template-columns: repeat(7, 1fr); font-size: 0.75rem; color: #c9a466; margin-bottom: 10px; }
.highlight { background-color: #a82424; color: white; border-radius: 50%; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; margin: 0 auto; box-shadow: 0 4px 10px rgba(168,36,36,0.3); }

/* 表單樣式 */
.form-card { max-width: 500px; background: #fff; padding: 30px; margin: 20px auto; border: 1px solid #e0d9d0; box-shadow: 0 5px 15px rgba(0,0,0,0.03); }
.submit-btn { width: 100%; padding: 15px; background: #c9a466; color: #fff; border: none; cursor: pointer; font-family: 'my font', serif; font-size: 1.2rem; transition: background 0.3s; }

/* 💎 留言板牆 */
.sticky-wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; padding: 20px; max-width: 900px; margin: 0 auto; }
.sticky-note { padding: 18px; box-shadow: 2px 3px 10px rgba(0,0,0,0.1); font-family: 'my font', serif; text-align: left; transition: transform 0.3s; position: relative; }
.sticky-note:nth-child(even) { background-color: #fdf5c9; transform: rotate(-2deg); }
.sticky-note:nth-child(odd) { background-color: #fce4ec; transform: rotate(2deg); }
.note-text { font-size: 1.1rem; color: #333; margin-bottom: 10px; min-height: 40px; line-height: 1.4; }
.note-author { font-size: 0.85rem; color: #888; text-align: right; border-top: 1px dashed rgba(0,0,0,0.1); padding-top: 5px; }

#musicToggle { position: fixed; bottom: 20px; right: 20px; width: 40px; height: 40px; border-radius: 50%; background: #c9a466; border: none; color: white; z-index: 9999; display: flex; align-items: center; justify-content: center; }
</style>
</head>
