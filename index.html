<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Jay & Michelle</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Noto+Serif+TC:wght@200;300;400;500;700&family=Gwendolyn:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Zen+Old+Mincho:wght@400;500&display=swap" rel="stylesheet">
<style>
/* 💎 1. 定義您的自定義字體 */
@font-face {
    font-family: 'my font';
    /* 這裡假設您的檔案名稱是 myfont.ttf，請確保與 GitHub 上傳的檔名完全一致（包含大小寫） */
    src: url('myfont.ttf') format('truetype'); 
    font-display: swap; /* 確保字體下載時不會導致白屏 */
}

/* 基礎修正 */
*{margin:0;padding:0;box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
html, body { width: 100%; height: 100%; height: -webkit-fill-available; overflow-x: hidden; background: #faf8f5;}
body{font-family:'Noto Serif TC',serif; color:#2c2c2c; position: relative;} 

/* --- 開場：拍立得 --- */
#intro-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #e8dcc4; z-index: 10000;
    display: flex; align-items: center; justify-content: center; transition: opacity 1.5s ease-in-out; touch-action: none; 
}
.camera-container { position: relative; width: 280px; height: 340px; background-image: url('camera.png'); background-size: contain; background-position: center; background-repeat: no-repeat; z-index: 10001; }
.photo-stack { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); width: 220px; height: 260px; z-index: 10000; }
.photo {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: #fff; border: 6px solid #fff; border-bottom: 25px solid #fff;
    box-shadow: 0 5px 15px rgba(0,0,0,0.15); transition: transform 1.2s cubic-bezier(0.22, 1, 0.36, 1), opacity 1.2s ease-out, filter 1.5s ease-out; 
    background-size: cover; background-position: center; opacity: 0; cursor: pointer;
}
/* 拍立得膠帶 */
.photo::after {
    content: ""; position: absolute; top: -10px; left: -15px; width: 90px; height: 25px;
    background-color: rgba(224, 203, 160, 0.85); transform: rotate(-12deg);
    box-shadow: 1px 2px 4px rgba(0,0,0,0.08); z-index: 10;
    clip-path: polygon( 2% 5%, 8% 0%, 92% 5%, 98% 0%, 100% 50%, 97% 95%, 90% 100%, 10% 95%, 0% 100%, 3% 50% );
    background-image: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0) 100%);
}
.photo:nth-child(1) { animation: printOut 1.2s forwards 0.3s; z-index: 1; --rot: 0deg; --slide: 0px; }
@keyframes printOut { from { opacity: 0; transform: translateY(-50px) rotate(0deg); } to { opacity: 1; transform: translateY(var(--slide)) rotate(var(--rot)); } }

/* 💎 點擊後影像慢慢淡出（影像變模糊且透明） */
.photo.dropped { transform: scale(1.1) translateY(-20px) !important; opacity: 0 !important; filter: blur(20px) !important; pointer-events: none; }

/* --- 主視覺 --- */
#main-wrapper { opacity: 0; visibility: hidden; transition: opacity 2s ease; }
#main-wrapper.is-visible { opacity: 1; visibility: visible; }
.cover { height: 100vh; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; position: relative; overflow: hidden; background-color: #f5f5dc; }
.cover::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url('bg_silk.jpg.png'); background-size: cover; background-position: center; z-index: 1; }

.getting-married-text { color:#c9a466; margin-bottom:12px; letter-spacing:0.4em; font-size: 0.85rem; z-index: 10; position: relative;}
.name-container { position: relative; z-index: 10; width: 100%; }
.english-names { font-family: 'Playfair Display', serif; font-size: clamp(2.2rem, 7vw, 4rem); font-weight: 300; }
.english-names .amp { font-family: 'Gwendolyn', cursive; font-size: clamp(3.5rem, 10vw, 5.5rem); color: #c9a466; margin: 0 8px; vertical-align: middle; }

/* 💎 2. 套用您的自定義字體 */
.chinese-names { 
    display: flex; justify-content: space-around; width: 85%; max-width: 450px; margin: 25px auto 0; 
    font-family: 'my font', 'Noto Serif TC', serif; 
    font-size: 2.2rem; letter-spacing: 0.2em; color: #4a4a4a; 
}

/* 內容區 */
.content-section { padding: 50px 20px; max-width: 1000px; margin: 0 auto; }
.grid-row { display: flex; flex-direction: column; gap: 30px; margin-bottom: 60px; }
.grid-images { display: flex; gap: 10px; width: 100%; }
.grid-img { flex: 1; height: 250px; background-size: cover; background-position: center; border: 5px solid #fff; box-shadow: 0 3px 10px rgba(0,0,0,0.05); }
.grid-text h3 { font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; color: #c9a466; margin-bottom: 10px; }

/* 婚禮資訊 & 倒數 */
.info-section { padding: 60px 20px; background: #fbf9f7; text-align: center; }
.info-card { background: #fff; padding: 40px 20px; margin: 20px auto; border: 1px solid #e0d9d0; }
.map-container { width: 100%; height: 300px; margin: 20px 0; border: 1px solid #e0d9d0; }

.countdown-container { display: flex; justify-content: center; gap: 10px; margin: 25px 0; }
.countdown-box { background: #c9a466; color: #fff; padding: 10px; border-radius: 8px; min-width: 60px; }
.countdown-number { font-size: 1.5rem; font-weight: bold; }
.countdown-label { font-size: 0.7rem; }

.calendar-wrapper { max-width: 300px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
.calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; font-size: 0.9rem; }
.highlight { background: #a82424; color: #fff; border-radius: 50%; width: 25px; height: 25px; display: inline-flex; align-items: center; justify-content: center; margin: 0 auto; }

/* 表單樣式 */
.form-card { max-width: 500px; background: #fff; padding: 30px; margin: 0 auto; border: 1px solid #e0d9d0; }
.form-group { margin-bottom: 20px; text-align: left; }
.form-group label { display: block; margin-bottom: 5px; }
.form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ddd; }
.submit-btn { width: 100%; padding: 12px; background: #c9a466; color: #fff; border: none; cursor: pointer; }

/* 留言板 */
.sticky-wall { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; padding: 20px; }
.sticky-note { background: #fdf5c9; padding: 15px; width: 180px; box-shadow: 2px 2px 5px rgba(0,0,0,0.1); transform: rotate(-2deg); }

#musicToggle { position: fixed; bottom: 20px; right: 20px; width: 40px; height: 40px; border-radius: 50%; background: #c9a466; border: none; color: white; cursor: pointer; z-index: 9999; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>

<div id="intro-overlay">
    <div class="camera-container">
        <div class="photo-stack">
            <div class="photo" onclick="dropPhoto(this)" style="background-image: url('P3.jpg');"></div>
        </div>
    </div>
</div>

<div id="main-wrapper">
    <div class="cover">
        <p class="getting-married-text">WE'RE GETTING MARRIED</p>
        <div class="name-container">
            <div class="english-names">Jay <span class="amp">&</span> Michelle</div>
            <div class="chinese-names"><span>蔡宇杰</span><span>陳旻瑄</span></div>
        </div>
        <p style="margin-top:20px; color:#888; letter-spacing:0.2em; font-size: 0.9rem; z-index: 10; position: relative;">2026·06·20</p>
    </div>

    <section class="content-section">
        <div class="grid-row">
            <div class="grid-images">
                <div class="grid-img" style="background-image: url('story1a.jpg');"></div>
                <div class="grid-img" style="background-image: url('story1b.jpg');"></div>
            </div>
            <div class="grid-text"><h3>Our Story</h3><p>在此輸入內容...</p></div>
        </div>
    </section>

    <section class="info-section">
        <h2 style="font-family:'Cormorant Garamond',serif; color:#c9a466; font-size: 2.2rem; margin-bottom: 20px;">Wedding Info</h2>
        <div class="wedding-date-header">
            <p>2026年6月20日 星期六</p>
        </div>

        <div class="countdown-container">
            <div class="countdown-box"><div class="countdown-number" id="cd-days">00</div><div class="countdown-label">Days</div></div>
            <div class="countdown-box"><div class="countdown-number" id="cd-hours">00</div><div class="countdown-label">Hrs</div></div>
            <div class="countdown-box"><div class="countdown-number" id="cd-minutes">00</div><div class="countdown-label">Mins</div></div>
            <div class="countdown-box"><div class="countdown-number" id="cd-seconds">00</div><div class="countdown-label">Secs</div></div>
        </div>

        <div class="calendar-wrapper">
            <div class="calendar-grid">
                <div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div><div>S</div>
                <div>1</div><div>2</div><div>3</div><div>4</div><div>5</div><div>6</div><div>7</div>
                <div>8</div><div>9</div><div>10</div><div>11</div><div>12</div><div>13</div><div>14</div>
                <div>15</div><div>16</div><div>17</div><div>18</div><div>19</div><div class="highlight">20</div><div>21</div>
            </div>
        </div>

        <div class="info-card">
            <p>暖居日穀 (台中市北屯區松竹路一段3號)</p>
            <div class="map-container">
                <iframe src="https://maps.google.com/maps?q=%E6%9A%96%E5%B1%85%E6%97%A5%E7%A9%80%20%E5%8F%B0%E4%B8%AD%E5%B8%82%E5%8C%97%E5%B1%AF%E5%8D%80%E6%9D%BE%E7%AB%B9%E8%B7%AF%E4%B8%80%E6%AE%B53%E8%99%9F&t=&z=16&ie=UTF8&iwloc=&output=embed" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
            </div>
            <a href="https://maps.app.goo.gl/9ZpYxX9H2T2rB7vF8" target="_blank" style="display:inline-block; padding:10px 20px; border:1px solid #c9a466; color:#c9a466; text-decoration:none;">導航地圖</a>
        </div>
    </section>

    <section class="form-section">
        <div class="form-card">
            <h3>RSVP 參加回覆</h3>
            <form id="rsvp-form">
                <div class="form-group"><input type="text" id="guest-name" placeholder="姓名" required></div>
                <button type="submit" class="submit-btn" id="rsvp-submit-btn">送出</button>
            </form>
        </div>
    </section>

    <footer style="text-align:center; padding:50px 0; color:#c9a466; font-style:italic;">See You Soon</footer>
</div>

<div id="player" style="position:fixed; top:-9999px;"></div>
<button id="musicToggle">▶</button>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
let droppedCount = 0;
var player;

function dropPhoto(el) {
    if (el.classList.contains('dropped')) return;
    if (droppedCount === 0 && player && typeof player.playVideo === 'function') { player.playVideo(); }
    el.classList.add('dropped');
    droppedCount++;
    
    if (droppedCount === 1) {
        setTimeout(() => {
            document.getElementById('intro-overlay').style.opacity = '0';
            document.getElementById('main-wrapper').classList.add('is-visible');
            document.body.style.overflow = 'auto';
            setTimeout(() => { document.getElementById('intro-overlay').style.display = 'none'; }, 1500); 
        }, 1000); 
    }
}

function onYouTubeIframeAPIReady() {
  player = new YT.Player('player', {
    videoId: 'pmrCXt4lNyA',
    playerVars: { 'autoplay': 1, 'loop': 1, 'playlist': 'pmrCXt4lNyA', 'controls': 0, 'playsinline': 1 },
    events: {
      'onReady': (e) => { e.target.setVolume(30); },
      'onStateChange': (e) => { document.getElementById('musicToggle').innerHTML = (e.data == 1) ? '||' : '▶'; }
    }
  });
}

function updateCountdown() {
    const weddingDate = new Date("June 20, 2026 12:00:00").getTime();
    const now = new Date().getTime();
    const distance = weddingDate - now;
    if (distance < 0) return;
    document.getElementById("cd-days").innerText = Math.floor(distance / (1000 * 60 * 60 * 24)).toString().padStart(2, '0');
    document.getElementById("cd-hours").innerText = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
    document.getElementById("cd-minutes").innerText = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
    document.getElementById("cd-seconds").innerText = Math.floor((distance % (1000 * 60)) / 1000).toString().padStart(2, '0');
}
setInterval(updateCountdown, 1000);
updateCountdown();

document.getElementById('musicToggle').onclick = function() {
  if (player && typeof player.getPlayerState === 'function') {
    player.getPlayerState() == 1 ? player.pauseVideo() : player.playVideo();
  }
};
</script>
</body>
</html>
